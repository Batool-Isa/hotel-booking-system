spring.application.name=billing-service
server.port=${SERVER_PORT:8084}

# Database: the billing schema in the shared vibestay database.
# Defaults point to the Docker Postgres from IntelliJ; docker-compose overrides them.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/vibestay-app?currentSchema=billing}
spring.datasource.username=${DB_USERNAME:billing_svc}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
