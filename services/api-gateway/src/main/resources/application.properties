spring.application.name=api-gateway
server.port=${SERVER_PORT:8000}
jwt-secret=FUNj6wvY59PSDwB5KrB9a2ozDKeV3QxjWLFiJFF7gTTA2sA+a1ozLYpMGPWfits0
jwt-expiration-ms=86400000
services.user.url=${USER_SERVICE_URL:http://localhost:8081}
services.hotel.url=${HOTEL_SERVICE_URL:http://localhost:8082}
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8083}
services.billing.url=${BILLING_SERVICE_URL:http://localhost:8084}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/users/**

spring.cloud.gateway.server.webflux.routes[1].id=hotel-service
spring.cloud.gateway.server.webflux.routes[1].uri=${services.hotel.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/hotels/**

# billing must come BEFORE booking: /api/bookings/{id}/payment would also match booking's /api/**
spring.cloud.gateway.server.webflux.routes[2].id=billing-service
spring.cloud.gateway.server.webflux.routes[2].uri=${services.billing.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/bookings/*/payment,/webhook,/webhook/**

spring.cloud.gateway.server.webflux.routes[3].id=booking-service
spring.cloud.gateway.server.webflux.routes[3].uri=${services.booking.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/**,/auth/**,/uploads/**,/ws/**,/swagger-ui/**,/v3/api-docs/**