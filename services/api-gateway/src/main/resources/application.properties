spring.application.name=api-gateway
server.port=${SERVER_PORT:8000}

# Service addresses: Docker Compose sets these to http://<service>:<port>; the defaults are for running locally.
services.user.url=${USER_SERVICE_URL:http://localhost:8081}
services.hotel.url=${HOTEL_SERVICE_URL:http://localhost:8082}
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8083}
services.billing.url=${BILLING_SERVICE_URL:http://localhost:8084}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}

# For now booking-service still holds the whole app, so every path goes there.
# As code moves out, add a route per service above this one (for example /auth/** -> user-service).
spring.cloud.gateway.server.webflux.routes[0].id=booking-service
spring.cloud.gateway.server.webflux.routes[0].uri=${services.booking.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**,/auth/**,/uploads/**,/ws/**,/webhook,/webhook/**,/swagger-ui/**,/v3/api-docs/**
