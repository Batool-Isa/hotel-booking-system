spring.application.name=api-gateway
server.port=${SERVER_PORT:8000}
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000
services.user.url=${USER_SERVICE_URL:http://localhost:8081}
services.hotel.url=${HOTEL_SERVICE_URL:http://localhost:8082}
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8083}
services.billing.url=${BILLING_SERVICE_URL:http://localhost:8084}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/users/**,/api/admin/users/**,/api/admin/stats/**
# hotel-service owns hotels, rooms, room types, amenities and the hotel/room photos it stores
spring.cloud.gateway.server.webflux.routes[1].id=hotel-service
spring.cloud.gateway.server.webflux.routes[1].uri=${services.hotel.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/hotels/**,/api/amenities/**,/api/rooms-types/**,/uploads/hotels/**,/uploads/rooms/**
# any other upload (profile photos) is stored by user-service; must stay after the hotel-service route
spring.cloud.gateway.server.webflux.routes[2].id=user-uploads
spring.cloud.gateway.server.webflux.routes[2].uri=${services.user.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/uploads/**
spring.cloud.gateway.server.webflux.routes[3].id=billing-service
spring.cloud.gateway.server.webflux.routes[3].uri=${services.billing.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/bookings/*/payment,/webhook,/webhook/**
spring.cloud.gateway.server.webflux.routes[4].id=booking-service
spring.cloud.gateway.server.webflux.routes[4].uri=${services.booking.url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/**,/auth/**,/ws/**,/swagger-ui/**,/v3/api-docs/**