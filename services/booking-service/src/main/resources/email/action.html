<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td style="padding:36px 32px 8px 32px;">
  <div style="font-size:26px;font-weight:bold;line-height:1.25;color:#1a1a1a;">{{TITLE}}</div>
  <div style="width:48px;height:4px;background-color:#febb02;border-radius:2px;margin-top:14px;"></div>
</td></tr>
<tr><td style="padding:18px 32px 0 32px;font-size:15px;line-height:1.7;color:#3c4043;">
  <p style="margin:0 0 14px 0;">Hello,</p>
  <p style="margin:0;">{{MESSAGE}}</p>
</td></tr>
<tr><td align="center" style="padding:30px 32px 8px 32px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
    <td align="center" style="background-color:#006ce4;border-radius:10px;">
      <a href="{{LINK}}" style="display:inline-block;padding:15px 38px;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;">{{BUTTON}}</a>
    </td>
  </tr></table>
</td></tr>

      <b style="color:#003b95;">Good to know:</b> {{EXPIRY}}
    </td>
  </tr></table>
</td></tr>
<tr><td style="padding:18px 32px 30px 32px;font-size:12px;line-height:1.6;color:#8a9099;">
  Button not working? Copy this link into your browser:<br>
  <a href="{{LINK}}" style="color:#006ce4;word-break:break-all;">{{LINK}}</a>
