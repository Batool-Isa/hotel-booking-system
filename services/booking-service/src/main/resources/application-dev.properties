# Development Profile
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vibestay?currentSchema=bookings}
spring.datasource.username=${DB_USERNAME:booking_svc}
spring.datasource.password=${DATABASE_PASSWORD:${BOOKING_SVC_DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.output.ansi.enabled=always

stripe.webhook.secret=${WEBHOOK_SECRET:${STRIPE_WEBHOOK_SECRET:}}
stripe.secretKey=${SECRET_KEY:${STRIPE_SECRET_KEY:}}
logging.level.com.ga.hotel_booking_app=DEBUG
