# Development Profile
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/vibestay-app}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.output.ansi.enabled=always
services.user.url=${USER_SERVICE_URL:http://localhost:8081}
services.hotel.url=${USER_HOTEL_URL:http://localhost:8082}
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000
stripe.webhook.secret=${WEBHOOK_SECRET:${STRIPE_WEBHOOK_SECRET:}}
stripe.secretKey=${SECRET_KEY:${STRIPE_SECRET_KEY:}}
logging.level.com.ga.bookingservice=DEBUG
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.acks=all
