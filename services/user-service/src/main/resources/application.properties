spring.application.name=user-service
server.port=${SERVER_PORT:8081}

# Database: the users schema in the shared vibestay database.
# Defaults point to the Docker Postgres from IntelliJ; docker-compose overrides them.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vibestay?currentSchema=users}
spring.datasource.username=${DB_USERNAME:user_svc}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
