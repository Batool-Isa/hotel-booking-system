spring.application.name=user-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000

internal.api-key=${INTERNAL_API_KEY:dev-internal-key-change-me}
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.acks=all
app.links.verify-email=${PUBLIC_API_URL:http://localhost:8000}/auth/users/verify-email?token=
app.links.reset-password=${FRONTEND_URL:http://localhost:8000}/#/reset-password?token=
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8083}
services.hotel.url=${HOTEL_SERVICE_URL:http://localhost:8082}
