x-common-env: &common-env
  DB_URL: ${DB_URL:?set DB_URL in .env}
  DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"

services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [vibestay-net]

  user-service:
    image: ${REGISTRY:-vibestay}/user-service:${TAG:-dev}
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *common-env
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env}
      KAFKA_SERVERS: kafka:29092
      BOOKING_SERVICE_URL: http://booking-service:8083
      HOTEL_SERVICE_URL: http://hotel-service:8082
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [vibestay-net]

  hotel-service:
    image: ${REGISTRY:-vibestay}/hotel-service:${TAG:-dev}
    build: { context: ., dockerfile: services/hotel-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *common-env
      USER_SERVICE_URL: http://user-service:8081
      KAFKA_SERVERS: kafka:29092
    volumes:
      - hotel-uploads:/app/uploads
    depends_on:
      kafka: { condition: service_healthy }
      user-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [vibestay-net]

  booking-service:
    image: ${REGISTRY:-vibestay}/booking-service:${TAG:-dev}
    build: { context: ., dockerfile: services/booking-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *common-env
      USER_SERVICE_URL: http://user-service:8081
      USER_HOTEL_URL: http://hotel-service:8082
      KAFKA_SERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }
      user-service: { condition: service_healthy }
      hotel-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [vibestay-net]

  billing-service:
    image: ${REGISTRY:-vibestay}/billing-service:${TAG:-dev}
    build: { context: ., dockerfile: services/billing-service/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *common-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      USER_SERVICE_URL: http://user-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8083
      KAFKA_SERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }
      user-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [vibestay-net]

  notification-service:
    image: ${REGISTRY:-vibestay}/notification-service:${TAG:-dev}
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    restart: unless-stopped
    environment:
      KAFKA_SERVERS: kafka:29092
      MAIL_USERNAME: ${MAIL_USERNAME:?set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in .env}
      USER_HOTEL_URL: http://hotel-service:8082
    depends_on:
      kafka: { condition: service_healthy }
      hotel-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [vibestay-net]

  api-gateway:
    image: ${REGISTRY:-vibestay}/api-gateway:${TAG:-dev}
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *common-env
      USER_SERVICE_URL: http://user-service:8081
      HOTEL_SERVICE_URL: http://hotel-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      BILLING_SERVICE_URL: http://billing-service:8084
    ports:
      - "8000:8000"
    depends_on:
      user-service: { condition: service_healthy }
      hotel-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      billing-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [vibestay-net]


  frontend:
    image: ${REGISTRY:-vibestay}/frontend:${TAG:-dev}
    build: { context: ./frontend }
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [vibestay-net]

networks:
  vibestay-net:

volumes:
  kafka-data:
  hotel-uploads:
