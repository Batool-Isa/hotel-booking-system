
x-service-defaults: &service-defaults
  restart: unless-stopped

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - postgres

  api-gateway:
    build: ./services/api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: 8000
      USER_SERVICE_URL: http://user-service:8081
      HOTEL_SERVICE_URL: http://hotel-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      BILLING_SERVICE_URL: http://billing-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      - booking-service
    networks:
      - postgres

  user-service:
    <<: *service-defaults
    build: ./services/user-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres_db:5432/vibestay?currentSchema=users
      DB_USERNAME: user_svc
      DB_PASSWORD: ${USER_SVC_DB_PASSWORD:?Set USER_SVC_DB_PASSWORD in .env}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - postgres

  hotel-service:
    <<: *service-defaults
    build: ./services/hotel-service
    environment:
      SERVER_PORT: 8082

  # Still holds most of the app; code moves out of it into the other services step by step.
    networks:
      - postgres

  booking-service:
    <<: *service-defaults
    build: ./services/booking-service
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres_db:5432/vibestay?currentSchema=bookings
      DB_USERNAME: booking_svc
      DATABASE_PASSWORD: ${BOOKING_SVC_DB_PASSWORD:?Set BOOKING_SVC_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - postgres

  billing-service:
    <<: *service-defaults
    build: ./services/billing-service
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres_db:5432/vibestay?currentSchema=billing
      DB_USERNAME: billing_svc
      DB_PASSWORD: ${BILLING_SVC_DB_PASSWORD:?Set BILLING_SVC_DB_PASSWORD in .env}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - postgres

  notification-service:
    <<: *service-defaults
    build: ./services/notification-service
    environment:
      SERVER_PORT: 8085
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    networks:
      - postgres

  postgres_db:
    image: postgres:18.6
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: vibestay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # read by docker/postgres/init/01-schemas.sh to create one user per service
      USER_SVC_DB_PASSWORD: ${USER_SVC_DB_PASSWORD}
      HOTEL_SVC_DB_PASSWORD: ${HOTEL_SVC_DB_PASSWORD:?Set HOTEL_SVC_DB_PASSWORD in .env}
      BOOKING_SVC_DB_PASSWORD: ${BOOKING_SVC_DB_PASSWORD}
      BILLING_SVC_DB_PASSWORD: ${BILLING_SVC_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vibestay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - postgres


networks:
  postgres:
    driver: bridge

volumes:
  pgdata:
  pgadmin:
  uploads:
