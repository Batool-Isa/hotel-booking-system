x-common-env: &common-env
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vibestay-app
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [vibestay-net]

  user-service:
    build: { context: ., args: { SERVICE: user-service } }
    environment:
      <<: *common-env
      FRONTEND_URL: ${FRONTEND_URL}
      DB_URL: jdbc:postgresql://postgres:5432/vibestay-app
      KAFKA_SERVERS: kafka:29092
    depends_on: [postgres, kafka]
    networks: [vibestay-net]

  hotel-service:
    build: { context: ., args: { SERVICE: hotel-service } }
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/vibestay-app
      USER_SERVICE_URL: http://user-service:8081
    depends_on: [postgres]
    networks: [vibestay-net]

  booking-service:
    build: { context: ., args: { SERVICE: booking-service } }
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/vibestay-app
      USER_SERVICE_URL: http://user-service:8081
      USER_HOTEL_URL: http://hotel-service:8082
      KAFKA_SERVERS: kafka:29092
    depends_on: [ postgres, kafka ]
    networks: [vibestay-net]

  billing-service:
    build: { context: ., args: { SERVICE: billing-service } }
    environment:
      <<: *common-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DB_URL: jdbc:postgresql://postgres:5432/vibestay-app
      USER_SERVICE_URL: http://user-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8083
      KAFKA_SERVERS: kafka:29092
    depends_on: [postgres, kafka]
    networks: [vibestay-net]

  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    environment:
      <<: *common-env
      USER_SERVICE_URL: http://user-service:8081
      HOTEL_SERVICE_URL: http://hotel-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      BILLING_SERVICE_URL: http://billing-service:8084
    ports:
      - "8000:8000"
    networks: [vibestay-net]
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    networks: [vibestay-net]

  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    environment:
      KAFKA_SERVERS: kafka:29092
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      USER_HOTEL_URL: http://hotel-service:8082
    depends_on: [kafka]
    networks: [vibestay-net]

networks:
  vibestay-net:

volumes:
  pgdata:
