<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VibeStay – Find your next stay</title>
    <meta name="theme-color" content="#003b95">
    <meta name="description" content="VibeStay – search hotels, check live availability and book your stay.">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .35s ease,visibility .35s ease}#splash.hide{opacity:0;visibility:hidden}#splash .sp-brand{display:flex;align-items:center;gap:14px;animation:sp-in .5s ease-out both}#splash .sp-name{font-size:2rem;font-weight:800;letter-spacing:-.6px;color:#003b95}#splash .sp-bar{position:relative;width:140px;height:3px;border-radius:3px;background:#e8edf5;overflow:hidden;animation:sp-in .5s .15s ease-out both}#splash .sp-bar span{position:absolute;inset:0 auto 0 0;width:35%;border-radius:3px;background:#003b95;animation:sp-load 1.2s cubic-bezier(.65,0,.35,1) infinite}@keyframes sp-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes sp-load{from{transform:translateX(-100%)}to{transform:translateX(300%)}}@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}</style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading VibeStay"><div class="sp-brand"><img src="/logo.svg" width="48" height="48" alt=""><span class="sp-name">VibeStay</span></div><div class="sp-bar"><span></span></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
