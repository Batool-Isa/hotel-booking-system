<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VibeStay – Find your next stay</title>
    <meta name="description" content="VibeStay – search hotels, check live availability and book your stay.">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#0a5ad8,#003b95 45%,#00224f);color:#fff;font-family:Inter,system-ui,sans-serif;transition:opacity .45s ease,visibility .45s ease}#splash.hide{opacity:0;visibility:hidden}#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:10px;animation:sp-pop .7s cubic-bezier(.2,.9,.3,1.3) both}#splash img{filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));animation:sp-float 2.4s ease-in-out infinite}#splash .sp-name{font-size:2.2rem;font-weight:800;letter-spacing:-.5px}#splash .sp-tag{opacity:.8;font-size:1rem}#splash .sp-bar{width:160px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:14px}#splash .sp-bar span{display:block;width:40%;height:100%;border-radius:4px;background:#febb02;animation:sp-load 1.1s ease-in-out infinite}@keyframes sp-pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}@keyframes sp-float{50%{transform:translateY(-6px)}}@keyframes sp-load{from{transform:translateX(-110%)}to{transform:translateX(260%)}}@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}</style>
  </head>
  <body>
    <div id="splash"><div class="sp-in"><img src="/logo.svg" width="88" height="88" alt=""><div class="sp-name">VibeStay</div><div class="sp-tag">Find your next stay</div><div class="sp-bar"><span></span></div></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
