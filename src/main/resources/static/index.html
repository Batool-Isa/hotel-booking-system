                            <p v-if="mh.live[h.id]===false" class="xs muted" style="margin:0">Waiting for admin approval (or inactive). Rooms can be added once it’s live.</p>
                            <div class="row" style="margin-top:auto"><a class="btn btn-primary btn-sm" :href="'#/manage/hotel/'+h.id">Manage</a><a class="btn btn-ghost btn-sm" :href="'#/hotel/'+h.id">Preview</a></div></div>
                    </article>
                </div>
                <div class="pager" v-if="mh.page>0 || mh.hasNext"><button class="btn btn-outline btn-sm" :disabled="mh.page===0" @click="loadManagerHotels(mh.page-1)"><icon name="left" :size="16"></icon>Previous</button><span class="muted small">Page {{mh.page+1}}</span><button class="btn btn-outline btn-sm" :disabled="!mh.hasNext" @click="loadManagerHotels(mh.page+1)">Next<icon name="right" :size="16"></icon></button></div>
            </div></section>

            <!-- ================= HOTEL FORM (new) ================= -->
            <section v-if="route.name==='manage-new'" class="page"><div class="wrap" style="max-width:780px">
                <div class="crumbs"><a :href="isAdmin?'#/admin?tab=hotels':'#/manage'">← Back</a></div>
                <div class="card pad">
                    <h2>Add a hotel</h2>
                    <alert-box v-if="isManager" type="info">New hotels are submitted for admin approval. You’ll be able to add rooms once it’s approved.</alert-box>
                    <alert-box v-else type="info">As an admin you must choose the manager (their <b>user ID</b>) who will run this hotel. The hotel goes live immediately.</alert-box>
                    <alert-box v-if="hotelF.banner" type="error" :msg="hotelF.banner"></alert-box>
                    <form @submit.prevent="saveHotel" novalidate>
                        <f-input v-model="hotelF.values.name" label="Hotel name" required :error="hotelF.errors.name" @blur="hotelF.check('name')"></f-input>
                        <f-input v-model="hotelF.values.description" textarea :rows="4" label="Description" required :maxlength="500" counter hint="10–500 characters" :error="hotelF.errors.description" @blur="hotelF.check('description')"></f-input>
                        <f-input v-model="hotelF.values.address" label="Street address" required :error="hotelF.errors.address" @blur="hotelF.check('address')"></f-input>
                        <div class="form-grid"><f-input v-model="hotelF.values.city" label="City" required list="city-list" :error="hotelF.errors.city" @blur="hotelF.check('city')"></f-input><f-input v-model="hotelF.values.country" label="Country" required :error="hotelF.errors.country" @blur="hotelF.check('country')"></f-input></div>
                        <f-input v-model="hotelF.values.phone" label="Phone" type="tel" required hint="8–12 characters" :error="hotelF.errors.phone" @blur="hotelF.check('phone')"></f-input>
                        <div class="form-grid"><f-input v-model="hotelF.values.latitude" label="Latitude (optional)" type="number" step="any" placeholder="26.2285" :error="hotelF.errors.latitude" @blur="hotelF.check('latitude')"></f-input><f-input v-model="hotelF.values.longitude" label="Longitude (optional)" type="number" step="any" placeholder="50.5860" :error="hotelF.errors.longitude" @blur="hotelF.check('longitude')"></f-input></div>
                        <button type="button" class="btn btn-ghost btn-sm" style="margin:-6px 0 14px" @click="useMyLocation"><icon name="pin" :size="15"></icon>Use my current location</button>
                        <f-input v-if="isAdmin" v-model="hotelF.values.managerId" label="Manager user ID" type="number" min="1" required hint="The numeric ID of a user with the Hotel manager role" :error="hotelF.errors.managerId" @blur="hotelF.check('managerId')"></f-input>
                        <div class="row"><button class="btn btn-primary btn-lg" :class="{'is-loading':hotelF.busy}">{{isAdmin?'Create hotel':'Submit for approval'}}</button><a class="btn btn-ghost" :href="isAdmin?'#/admin?tab=hotels':'#/manage'">Cancel</a></div>
                    </form>
                </div>
            </div></section>

            <!-- ================= MANAGE ONE HOTEL ================= -->
            <section v-if="route.name==='manage-hotel'" class="page"><div class="wrap">
                <div v-if="page.loading && !mp.hotel"><div class="skel" style="height:60px;margin-bottom:14px"></div><div class="skel" style="height:300px"></div></div>
                <div v-else-if="page.error" class="card empty"><div class="big"><icon name="alert" :size="30"></icon></div><h3>Couldn’t load this hotel</h3><p>{{page.error}}</p><a class="btn btn-primary" :href="isAdmin?'#/admin?tab=hotels':'#/manage'">Back</a></div>
                <template v-else-if="mp.hotel">
                    <div class="crumbs"><a :href="isAdmin?'#/admin?tab=hotels':'#/manage'">← {{isAdmin?'Admin panel':'My hotels'}}</a></div>
                    <div class="row between"><div><h2 style="margin-bottom:2px">{{mp.hotel.name}}</h2><div class="muted small"><icon name="pin" :size="14"></icon> {{mp.hotel.city}}, {{mp.hotel.country}} · ID {{mp.hotel.id}}
                        <span v-if="mp.live===true" class="badge b-green" style="margin-left:6px">Live</span><span v-else-if="mp.live===false" class="badge b-yellow" style="margin-left:6px">Not live yet</span></div></div>
                        <a class="btn btn-outline btn-sm" :href="'#/hotel/'+mp.hotel.id" target="_blank"><icon name="ext" :size="14"></icon>View public page</a></div>
                    <div class="tabs mt">
                        <button class="tab" :class="{on:mp.tab==='overview'}" @click="manageTab('overview')"><icon name="edit" :size="16"></icon>Details</button>
                        <button class="tab" :class="{on:mp.tab==='rooms'}" @click="manageTab('rooms')"><icon name="bed" :size="16"></icon>Rooms</button>
                        <button class="tab" :class="{on:mp.tab==='photos'}" @click="manageTab('photos')"><icon name="image" :size="16"></icon>Photos</button>
                        <button class="tab" :class="{on:mp.tab==='policy'}" @click="manageTab('policy')"><icon name="baby" :size="16"></icon>Child policy</button>
                        <button class="tab" :class="{on:mp.tab==='bookings'}" @click="manageTab('bookings')"><icon name="calendar" :size="16"></icon>Bookings</button>
                    </div>

                    <!-- details -->
                    <div v-if="mp.tab==='overview'" class="card pad" style="max-width:780px">
                        <alert-box v-if="mp.live===false" type="warn">This hotel isn’t live yet. It needs admin approval (or has been deactivated), so guests can’t find or book it.</alert-box>
                        <alert-box v-if="hotelF.banner" type="error" :msg="hotelF.banner"></alert-box>
                        <form @submit.prevent="saveHotel" novalidate>
                            <f-input v-model="hotelF.values.name" label="Hotel name" required :error="hotelF.errors.name" @blur="hotelF.check('name')"></f-input>
                            <f-input v-model="hotelF.values.description" textarea :rows="4" label="Description" required :maxlength="500" counter :error="hotelF.errors.description" @blur="hotelF.check('description')"></f-input>
                            <f-input v-model="hotelF.values.address" label="Street address" required :error="hotelF.errors.address" @blur="hotelF.check('address')"></f-input>
                            <div class="form-grid"><f-input v-model="hotelF.values.city" label="City" required :error="hotelF.errors.city" @blur="hotelF.check('city')"></f-input><f-input v-model="hotelF.values.country" label="Country" required :error="hotelF.errors.country" @blur="hotelF.check('country')"></f-input></div>
                            <f-input v-model="hotelF.values.phone" label="Phone" type="tel" required hint="8–12 characters" :error="hotelF.errors.phone" @blur="hotelF.check('phone')"></f-input>
                            <div class="form-grid"><f-input v-model="hotelF.values.latitude" label="Latitude" type="number" step="any" :error="hotelF.errors.latitude" @blur="hotelF.check('latitude')"></f-input><f-input v-model="hotelF.values.longitude" label="Longitude" type="number" step="any" :error="hotelF.errors.longitude" @blur="hotelF.check('longitude')"></f-input></div>
                            <f-input v-if="isAdmin" v-model="hotelF.values.managerId" label="Add another manager (user ID, optional)" type="number" min="1" :error="hotelF.errors.managerId"></f-input>
                            <button class="btn btn-primary" :class="{'is-loading':hotelF.busy}">Save changes</button>
                        </form>
                    </div>

                    <!-- rooms -->
                    <div v-if="mp.tab==='rooms'">
                        <div class="row between mb"><div><h3 style="margin:0">Rooms</h3><div class="small muted">Rooms guests can book at this hotel.</div></div><button class="btn btn-primary" :disabled="mp.live===false" @click="openRoomModal"><icon name="plus" :size="16"></icon>Add room</button></div>
                        <alert-box v-if="mp.roomsMsg" type="warn" :msg="mp.roomsMsg"></alert-box>
                        <div v-else-if="!mp.rooms.length" class="card empty"><div class="big"><icon name="bed" :size="30"></icon></div><h3>No rooms yet</h3><p>Add your first room so guests can start booking.</p><button class="btn btn-primary" @click="openRoomModal">Add a room</button></div>
                        <div v-else class="card scroll-x"><table class="t plain"><thead><tr><th>Room</th><th>Floor</th><th>Type</th><th>Adults</th><th>Children</th><th>Max guests</th><th>Price / night</th><th>Status</th></tr></thead>
                            <tbody><tr v-for="r in mp.rooms" :key="r.id"><td><b>{{r.roomNumber}}</b></td><td>{{r.floorNumber}}</td><td>{{r.roomTypeName}}</td><td>{{r.maxAdults}}</td><td>{{r.maxChildren}}</td><td>{{r.maxOccupancy}}</td><td>{{money(r.pricePerNight)}}</td><td><span class="badge" :class="statusClass(r.status)">{{statusLabel(r.status)}}</span></td></tr></tbody></table></div>
                        <div class="pager" v-if="mp.roomsPage>0 || mp.roomsNext"><button class="btn btn-outline btn-sm" :disabled="mp.roomsPage===0" @click="loadMRooms(mp.roomsPage-1)">Previous</button><span class="muted small">Page {{mp.roomsPage+1}}</span><button class="btn btn-outline btn-sm" :disabled="!mp.roomsNext" @click="loadMRooms(mp.roomsPage+1)">Next</button></div>
                    </div>

                    <!-- photos -->
                    <div v-if="mp.tab==='photos'" class="stack">
                        <div class="card pad">
                            <h3>Upload photos</h3><p class="small muted">Add clear, bright photos. Each needs a short description (shown to screen-reader users). Up to 1 MB per photo, 10 photos at a time.</p>
                            <alert-box v-if="imgUp.err" type="error" :msg="imgUp.err"></alert-box>
                            <label class="dz" style="display:block"><icon name="image" :size="28"></icon><div><b>Click to choose photos</b></div><div class="xs">You can select several at once</div><input type="file" accept="image/jpeg,image/png,image/webp" multiple class="hide" @change="pickHotelImages"></label>

                            <button v-if="imgUp.items.length" class="btn btn-primary mt" :class="{'is-loading':imgUp.busy}" @click="uploadHotelImages"><icon name="upload" :size="16"></icon>Upload {{plural(imgUp.items.length,'photo')}}</button>
                        </div>
                        <div class="card pad"><h3>Current photos</h3>
                            <alert-box v-if="mp.images.length && mp.imgFails>=mp.images.length" type="warn"><b>Photos saved, but the server isn’t serving them.</b> Spring Boot needs a resource handler for the <code>/uploads/**</code> folder – see the backend notes.</alert-box>

                            <div class="grid g4"><div v-for="img in mp.images" :key="img.id"><div class="pimg"><hotel-img :src="img.imageUrl" :name="mp.hotel.name" :alt="img.altText" @fail="mp.imgFails++"></hotel-img><button class="btn btn-danger btn-sm del" @click="deleteHotelImage(img)" aria-label="Delete photo"><icon name="trash" :size="14"></icon></button></div><div class="xs muted" style="margin-top:4px">{{img.altText}}</div></div></div>
                        </div>
                    </div>

                                <f-input v-model="policyF.values.childMaxAge" label="Child: up to age" type="number" min="1" max="17" required hint="1–17 years; must be above infant age" :error="policyF.errors.childMaxAge" @blur="policyF.check('childMaxAge')"></f-input></div>

                            <label class="check mb"><input type="checkbox" v-model="policyF.values.infantsCountTowardOccupancy">Infants count towards room occupancy</label>
                            <button class="btn btn-primary" :class="{'is-loading':policyF.busy}">{{mp.policyMissing?'Create policy':'Save policy'}}</button>
                        </form>
                    </div>

                    <!-- bookings -->
                    <div v-if="mp.tab==='bookings'" class="card pad"><lookup-panel :lk="lk" @find="lookupBooking" @complete="completeBooking" @cancel="cancelFromLookup"></lookup-panel></div>
                </template>
            </div></section>

            <!-- ================= ADMIN ================= -->
            <section v-if="route.name==='admin'" class="page"><div class="wrap">
                <h2>Admin panel</h2>
                <div class="tabs">
                    <button class="tab" :class="{on:ad.tab==='overview'}" @click="adminTab('overview')"><icon name="home" :size="16"></icon>Overview</button>
                    <button class="tab" :class="{on:ad.tab==='pending'}" @click="adminTab('pending')"><icon name="clock" :size="16"></icon>Pending approvals</button>
                    <button class="tab" :class="{on:ad.tab==='hotels'}" @click="adminTab('hotels')"><icon name="building" :size="16"></icon>Hotels</button>
                    <button class="tab" :class="{on:ad.tab==='users'}" @click="adminTab('users')"><icon name="users" :size="16"></icon>Users</button>
                    <button class="tab" :class="{on:ad.tab==='types'}" @click="adminTab('types')"><icon name="bed" :size="16"></icon>Room types</button>
                    <button class="tab" :class="{on:ad.tab==='status'}" @click="adminTab('status')"><icon name="settings" :size="16"></icon>Hotel status</button>
                    <button class="tab" :class="{on:ad.tab==='bookings'}" @click="adminTab('bookings')"><icon name="calendar" :size="16"></icon>Bookings</button>
                </div>

                <div v-if="ad.tab==='overview'">

                        <div class="card stat"><b>{{ad.counts.users ?? '–'}}</b><span>Registered users</span><div class="mt"><a class="btn btn-outline btn-sm" href="#/admin?tab=users">Manage</a></div></div>
                        <div class="card stat"><b>{{ad.counts.types ?? '–'}}</b><span>Active room types</span><div class="mt"><a class="btn btn-outline btn-sm" href="#/admin?tab=types">Manage</a></div></div></div>
                    <div class="row mt2"><a class="btn btn-primary" href="#/manage/new"><icon name="plus" :size="16"></icon>Create a hotel</a><a class="btn btn-outline" href="#/admin?tab=bookings">Find a booking</a></div>
                </div>

                <div v-if="ad.tab==='pending'">
                    <div v-if="ad.loading" class="skel" style="height:120px"></div>
                    <div v-else-if="!ad.pending.length" class="card empty"><div class="big"><icon name="check" :size="30"></icon></div><h3>All caught up</h3><p>No hotels are waiting for approval.</p></div>

                <div class="form-grid"><f-input v-model="roomF.values.roomNumber" label="Room number" required :error="roomF.errors.roomNumber" @blur="roomF.check('roomNumber')"></f-input><f-input v-model="roomF.values.floorNumber" label="Floor" required :error="roomF.errors.floorNumber" @blur="roomF.check('floorNumber')"></f-input></div>
                <f-input v-model="roomF.values.pricePerNight" label="Price per night (BHD)" type="number" min="0.01" step="0.01" required :error="roomF.errors.pricePerNight" @blur="roomF.check('pricePerNight')"></f-input>

            <form @submit.prevent="doAssign" novalidate><div class="modal-b">
                <p class="small muted">Add another manager to <b>{{assignF.values.hotelName}}</b>.</p>
                <alert-box v-if="assignF.banner" type="error" :msg="assignF.banner"></alert-box>
                <f-input v-model="assignF.values.managerId" label="Manager user ID" type="number" min="1" required :error="assignF.errors.managerId" @blur="assignF.check('managerId')"></f-input>
            </div><div class="modal-f"><button type="button" class="btn btn-ghost" @click="assignModal.open=false">Cancel</button><button class="btn btn-primary" :class="{'is-loading':assignF.busy}">Assign</button></div></form>

            <div class="modal-b"><h3>{{dlg.title}}</h3><p class="muted" style="margin:0">{{dlg.message}}</p></div>
            <div class="modal-f"><button class="btn btn-ghost" @click="answer(false)">{{dlg.cancelText}}</button><button class="btn" :class="dlg.danger?'btn-danger':'btn-primary'" @click="answer(true)">{{dlg.confirmText}}</button></div>
        </div></div>

        <div class="toasts no-print" aria-live="polite">
            <div v-for="t in toasts" :key="t.id" class="toast" :class="t.type" role="status">
                <icon :name="t.type==='success'?'ok':t.type==='error'?'alert':t.type==='warn'?'alert':'info'" :size="20"></icon><div>{{t.msg}}</div><button @click="dismiss(t.id)" aria-label="Dismiss"><icon name="x" :size="16"></icon></button>

<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script>
    (() => {
        'use strict';
        const { createApp, ref, reactive, computed, watch, nextTick } = Vue;
        /* If you serve this page from Spring Boot (src/main/resources/static) leave this empty.
           To run it from another origin set  window.VIBESTAY_API = 'http://localhost:8000'  before this script
           (and enable CORS in Spring Boot). */
        const API_BASE = (window.VIBESTAY_API || '').replace(/\/$/, '');

        /* ---------------------------------------------------------------- helpers */
        const store = {
            get(k){ try { return localStorage.getItem(k); } catch { return null; } },
            set(k,v){ try { localStorage.setItem(k,v); } catch {} },
            del(k){ try { localStorage.removeItem(k); } catch {} }
        };
        const pad2 = n => String(n).padStart(2,'0');
        const toISO = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
        const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
        const todayISO = () => toISO(new Date());
        const parseISO = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
        const nightsBetween = (a,b) => { if(!a||!b) return 0; const A=parseISO(a), B=parseISO(b); return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate())-Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/86400000); };
        const fmtDate = s => { if(!s) return ''; const d = parseISO(String(s).slice(0,10)); return isNaN(d) ? s : d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); };
        const fmtDateTime = s => { if(!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
        const money = n => 'BHD ' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:3});
        const plural = (n,w,p) => `${n} ${n===1?w:(p||w+'s')}`;
        const initials = s => String(s||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase() || '?';
        const imgUrl = u => {
            if(!u) return '';
            u = String(u).replace(/\\/g,'/');
            if(/^(https?:|data:|blob:)/i.test(u)) return u;
            u = u.replace(/^\.?\//,'');
            return API_BASE + '/' + u;
        };
        const GRADS = [['#0a3d91','#3b8cff'],['#0b5d57','#2bb5a0'],['#5b2a86','#a06bd6'],['#8a3b12','#e8913a'],['#1f4e79','#5aa9e6'],['#7a1f3d','#d6567e']];
        const phStyle = seed => { let h=0; for(const c of String(seed||'x')) h=(h*31+c.charCodeAt(0))>>>0; const g=GRADS[h%GRADS.length]; return `background:linear-gradient(135deg,${g[0]},${g[1]})`; };
        const AMENITY_ICON = {'wi-fi':'📶','wifi':'📶','swimming pool':'🏊','pool':'🏊','gym':'🏋️','parking':'🅿️','restaurant':'🍽️','spa':'💆','breakfast':'🥐','beach access':'🏖️','room service':'🛎️','air conditioning':'❄️'};
        const amenityIcon = n => AMENITY_ICON[String(n||'').toLowerCase()] || '✔️';
        const STATUS = {
            CONFIRMED:['Confirmed','b-green'], COMPLETED:['Completed','b-blue'], CANCELLED:['Cancelled','b-red'], PENDING:['Pending','b-yellow'],
            ACTIVE:['Active','b-green'], INACTIVE:['Inactive','b-gray'], PENDING_APPROVAL:['Waiting for approval','b-yellow'], REJECTED:['Rejected','b-red'], UNDER_MAINTENANCE:['Maintenance','b-yellow']
        };
        const statusLabel = s => (STATUS[s]||[s])[0];
        const statusClass = s => (STATUS[s]||[0,'b-gray'])[1];
        const ROLE_LABEL = {CUSTOMER:'Guest',HOTEL_MANAGER:'Hotel manager',ADMIN:'Administrator',STAFF:'Staff'};
        const jwtExp = t => { try { const p = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); return p.exp||0; } catch { return 0; } };
        const classify = (age, pol) => { if(!pol) return 'ADULT'; if(age<=pol.infantMaxAge) return 'INFANT'; if(age<=pol.childMaxAge) return 'CHILD'; return 'ADULT'; };

        /* ---------------------------------------------------------------- validation (mirrors the Spring DTO rules) */
        const blank = v => v===null || v===undefined || String(v).trim()==='';
        const R = {
            req:  label => v => blank(v) ? `${label} is required` : '',
            email:() => v => !blank(v) && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim()) ? 'Please enter a valid email address' : '',
            min:  (n,label) => v => !blank(v) && String(v).length < n ? `${label} must be at least ${n} characters` : '',
            max:  (n,label) => v => !blank(v) && String(v).length > n ? `${label} cannot exceed ${n} characters` : '',
            len:  (a,b,label) => v => !blank(v) && (String(v).trim().length<a || String(v).trim().length>b) ? `${label} must be between ${a} and ${b} characters` : '',
            num:  (label,{min,max,int,optional}={}) => v => {
                if(blank(v)) return optional ? '' : `${label} is required`;
                const n = Number(v);
                if(Number.isNaN(n)) return `${label} must be a number`;
                if(int && !Number.isInteger(n)) return `${label} must be a whole number`;
                if(min!==undefined && n<min) return `${label} must be at least ${min}`;
                if(max!==undefined && n>max) return `${label} cannot exceed ${max}`;
                return '';
            },
            same: (other,msg) => (v,d) => v !== d[other] ? msg : '',
            custom: fn => fn,
        };
        function useForm(initial, rules){
            const values = reactive({...initial});
            const errors = reactive({});
            const banner = ref('');
            const busy = ref(false);
            const check = f => { let m=''; for(const fn of (rules[f]||[])){ m = fn(values[f], values); if(m) break; } errors[f]=m; return !m; };
            const validateAll = () => { let ok=true, first=null; for(const f of Object.keys(rules)){ if(!check(f)){ ok=false; first=first||f; } } if(!ok) nextTick(()=>focusFirstError()); return ok; };
            const reset = (data) => { Object.assign(values, {...initial, ...(data||{})}); for(const k of Object.keys(errors)) delete errors[k]; banner.value=''; };
            watch(values, () => { for(const f of Object.keys(errors)) if(errors[f]) check(f); }, {deep:true});
            return reactive({ values, errors, banner, busy, check, validateAll, reset });
        }
        function focusFirstError(){
            const el = document.querySelector('.has-error input, .has-error select, .has-error textarea, .sb-field.bad input');
            if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); el.focus({preventScroll:true}); }
        }

        /* ---------------------------------------------------------------- API layer */
        class ApiError extends Error { constructor(status, message, data){ super(message); this.status=status; this.data=data; } }
        const pending = ref(0);
        const auth = reactive({ token: store.get('vs_token')||'', user: null });

    <alert-box type="info">The API has no “list all bookings” endpoint yet, so look a booking up by its numeric ID (the <code>id</code> field), then complete or cancel it.</alert-box>
    <form class="row" style="align-items:flex-start" @submit.prevent="$emit('find')" novalidate>
      <div style="width:240px"><f-input v-model="lk.id" label="Booking ID" type="number" min="1" placeholder="e.g. 12" :error="lk.err"></f-input></div>
      <button class="btn btn-primary" style="margin-top:26px" :class="{'is-loading':lk.loading}">Find booking</button>
    </form>
    <div v-if="lk.data" class="card pad mt">
      <booking-detail :b="lk.data"></booking-detail>
      <div class="row mt" v-if="lk.data.status==='CONFIRMED'">
        <button v-if="canComplete" class="btn btn-green" @click="$emit('complete',lk.data)"><icon name="check"></icon>Mark as completed</button>
        <button class="btn btn-danger-o" @click="$emit('cancel',lk.data)"><icon name="x"></icon>Cancel booking</button>
      </div>
      <p v-else class="muted small mt">This booking is {{statusLabel(lk.data.status).toLowerCase()}} and can’t be changed any more.</p>
    </div>
  </div>` });

        /* ================================================================ setup() */
        function setup(){
            /* ---------------- router ---------------- */
            const route = reactive({ name:'home', params:{}, query:{} });
            const page = reactive({ loading:true, error:'' });
            const menuOpen = ref(false), feedOpen = ref(false);
            let navSeq = 0, afterLogin = '';
            let readyResolve; const authReady = new Promise(r => { readyResolve = r; });
            const TITLES = { home:'Find your next stay', search:'Search results', explore:'Explore hotels', hotel:'Hotel', book:'Complete your booking', login:'Sign in', register:'Create account', forgot:'Forgot password', 'reset-password':'Reset password', 'verify-email':'Verify email', 'check-email':'Check your email', profile:'My profile', bookings:'My bookings', manage:'Manager portal', 'manage-new':'Add a hotel', 'manage-hotel':'Manage hotel', admin:'Admin panel' };

            function parseHash(){
                const h = location.hash.replace(/^#/,'') || '/';
                const [pathPart, qs=''] = h.split('?');
                const query = Object.fromEntries(new URLSearchParams(qs));
                const segs = pathPart.split('/').filter(Boolean);
                const params = {}; let name = 'home';
                switch(segs[0]){
                    case undefined: break;
                    case 'search': case 'explore': case 'login': case 'register': case 'forgot': case 'reset-password': case 'verify-email': case 'check-email': case 'profile': case 'bookings': case 'admin': name = segs[0]; break;
                    case 'hotel': name='hotel'; params.id = segs[1]; break;
                    case 'book': name='book'; params.id = segs[1]; break;
                    case 'manage': if(segs[1]==='new') name='manage-new'; else if(segs[1]==='hotel'){ name='manage-hotel'; params.id=segs[2]; } else name='manage'; break;
                    default: name='notfound';
                }
                return { name, params, query };
            }
            function go(path){ const h = '#'+path; if(location.hash===h) applyRoute(); else location.hash = h; }
            function silentUrl(path){ try{ history.replaceState(null,'','#'+path); }catch{} }
            const href = p => '#'+p;

            function guard(r){
                const n = r.name;
                if(['profile','bookings','book','manage','manage-new','manage-hotel','admin'].includes(n) && !auth.user) return { to:'/login', login:true, msg:'Please sign in to continue.' };
                if(['login','register','forgot'].includes(n) && auth.user) return { to:'/' };
                if(n==='bookings' && !isCustomer.value) return { to:'/', msg:'“My bookings” is for guest accounts.', type:'warn' };
                if(n==='book' && !isCustomer.value) return { to:`/hotel/${r.params.id}`, msg:'Only guest accounts can make bookings. Sign in with a guest account to continue.', type:'warn' };
                if((n==='manage'||n==='manage-new'||n==='manage-hotel') && !(isManager.value||isAdmin.value)) return { to:'/', msg:"You don't have access to the manager portal.", type:'warn' };
                if(n==='manage' && isAdmin.value) return { to:'/admin?tab=hotels' };
                if(n==='admin' && !isAdmin.value) return { to:'/', msg:'The admin panel is for administrators only.', type:'warn' };
                return null;
            }
            async function applyRoute(){
                const seq = ++navSeq;
                await authReady;
                if(seq!==navSeq) return;
                const r = parseHash();
                const g = guard(r);
                if(g){ if(g.login) afterLogin = location.hash; if(g.msg) toast(g.msg, g.type||'info'); go(g.to); return; }
                route.name = r.name; route.params = r.params; route.query = r.query;
                menuOpen.value = false; feedOpen.value = false;
                document.title = (TITLES[r.name]||'VibeStay') + ' – VibeStay';
                window.scrollTo(0,0);
                page.error = ''; page.loading = true;
                try{ await loadRoute(r, seq); }
                catch(e){ if(seq===navSeq) page.error = e.message || 'Something went wrong.'; }
                finally{ if(seq===navSeq) page.loading = false; }
            }
            async function loadRoute(r, seq){
                lk.data=null; lk.err=''; lk.id='';
                switch(r.name){
                    case 'home': return loadHome();
                    case 'search': return loadSearch(r.query);
                    case 'explore': return loadExplore(0);
                    case 'hotel': return loadHotel(r.params.id, r.query);
                    case 'book': return loadBook(r.params.id, r.query);
                    case 'bookings': return loadBookings(0);
                    case 'profile': return loadProfilePage();
                    case 'manage': return loadManagerHotels(0);
                    case 'manage-new': return initHotelForm(null);
                    case 'manage-hotel': return loadManageHotel(r.params.id, r.query.tab||'overview');
                    case 'admin': return loadAdmin(r.query.tab||'overview');
                    case 'verify-email': return runVerify(r.query.token);
                    case 'reset-password': resetF.reset({ token: r.query.token||'' }); return;
                    case 'login': loginF.reset(); return;
                    case 'register': regF.reset(); regImage.file=null; regImage.preview=''; regImage.error=''; return;
                    case 'forgot': forgotF.reset(); forgotSent.value=false; return;
                    case 'check-email': return;
                }
            }

            /* ---------------- session ---------------- */
            const profileImage = computed(() => auth.user ? imgUrl(auth.user.profileImageUrl) : '');
            const userInitials = computed(() => auth.user ? initials((auth.user.firstName||'')+' '+(auth.user.lastName||'') || auth.user.username) : '');
            async function loadProfile(){ const u = await api('GET','/auth/users/profile'); auth.user = u; return u; }
            function clearSession(){ auth.token=''; auth.user=null; store.del('vs_token'); disconnectWs(); }
            function expireSession(){ if(!auth.token) return; clearSession(); toast('Your session has expired. Please sign in again.','warn'); afterLogin = location.hash; go('/login'); }
            function logout(){ clearSession(); known.clear(); feed.value=[]; unread.value=0; toast('You have been signed out. See you soon!','info'); go('/'); }
            window.__expireSession = expireSession;

            /* ---------------- forms: auth ---------------- */
            const loginF = useForm({ email:'', password:'' }, { email:[R.req('Email'),R.email()], password:[R.req('Password')] });
            async function doLogin(){
                loginF.banner=''; if(!loginF.validateAll()) return;
                loginF.busy = true;
                try{
                    const data = await api('POST','/auth/users/login',{ auth:false, body:{ email:loginF.values.email.trim(), password:loginF.values.password } });
                    const token = data && typeof data==='object' ? (data.message||data.token||data.jwt) : data;
                    if(typeof token!=='string' || token.split('.').length!==3) throw new ApiError(200,'Signed in, but the server did not return a valid token.');
                    auth.token = token; store.set('vs_token', token);
                    await loadProfile(); connectWs();
                    toast(`Welcome back, ${auth.user.firstName||auth.user.username}!`);
                    loginF.reset();
                    const dest = afterLogin; afterLogin='';
                    if(dest && !/^#\/(login|register)/.test(dest)) location.hash = dest;
                    else go(isManager.value ? '/manage' : isAdmin.value ? '/admin' : '/');
                }catch(e){
                    clearSession(); loginF.banner = e.message;
                }finally{ loginF.busy = false; }
            }

            const regF = useForm({ firstName:'', lastName:'', username:'', email:'', phone:'', password:'', confirmedPassword:'' }, {
                firstName:[R.req('First name')], lastName:[R.req('Last name')], username:[R.req('Username')],
                email:[R.req('Email'),R.email()], phone:[R.req('Phone number')],
                password:[R.req('Password'),R.min(8,'Password')],
                confirmedPassword:[R.req('Confirm password'),R.same('password','Passwords do not match')]
            });
            const regImage = reactive({ file:null, preview:'', error:'' });
            const pwStrength = computed(() => {
                const p = regF.values.password||''; let s = 0;
                if(p.length>=8) s++; if(p.length>=12) s++; if(/[A-Z]/.test(p)&&/[a-z]/.test(p)) s++; if(/\d/.test(p)) s++; if(/[^A-Za-z0-9]/.test(p)) s++;
                const lvl = [['Too short','#c5192d',10],['Weak','#e8590c',30],['Okay','#e8a900',55],['Good','#4c9a2a',80],['Strong','#008234',100],['Strong','#008234',100]][p?s:0];
                return { label: p ? lvl[0] : '', color: lvl[1], pct: p ? lvl[2] : 0 };
            });
            function pickImage(e, target){
                const f = e.target.files && e.target.files[0]; target.error=''; if(!f) return;
                if(!/^image\/(jpeg|jpg|png|webp)$/.test(f.type)){ target.error='Please choose an image file (JPG, PNG or WebP).'; e.target.value=''; return; }
                if(f.size > 1024*1024){ target.error='That photo is '+(f.size/1048576).toFixed(1)+' MB – the server accepts up to 1 MB. Please choose a smaller one.'; e.target.value=''; return; }
                target.file = f; if(target.preview) URL.revokeObjectURL(target.preview); target.preview = URL.createObjectURL(f);
            }
            function mapServerErr(form, msg, pairs){ for(const [re,field] of pairs){ if(re.test(msg)){ form.errors[field]=msg; return true; } } return false; }
            async function doRegister(){
                regF.banner=''; let ok = regF.validateAll();
                if(!ok) return;
                const fd = new FormData(); const v = regF.values;
                for(const k of ['username','email','password','confirmedPassword','firstName','lastName','phone']) fd.append(k, typeof v[k]==='string' && k!=='password' && k!=='confirmedPassword' ? v[k].trim() : v[k]);
                if(regImage.file) fd.append('image', regImage.file);   // the photo is optional
                regF.busy = true;
                try{
                    await api('POST','/auth/users/register',{ auth:false, form:fd });
                    const em = v.email.trim(); regF.reset(); regImage.file=null; regImage.preview='';
                    go('/check-email?email='+encodeURIComponent(em));
                }catch(e){
                    if(e.status===409){ regF.errors.email = 'An account with this email already exists. Try signing in instead.'; regF.banner = 'Please fix the highlighted field and try again.'; }
                    else if(!mapServerErr(regF, e.message, [[/email/i,'email'],[/do not match|mismatch/i,'confirmedPassword'],[/password/i,'password'],[/username/i,'username']])) regF.banner = e.message;
                    else regF.banner = 'Please fix the highlighted field and try again.';
                }finally{ regF.busy=false; }
            }
            const verify = reactive({ state:'idle', msg:'', token:'' });
            const extractToken = s => { const m = String(s||'').match(/token=([A-Za-z0-9-]+)/); return m ? m[1] : String(s||'').trim(); };
            async function runVerify(token){
                verify.token = token||''; verify.msg=''; verify.state = token ? 'loading' : 'idle';
                if(!token) return;
                try{ const t = await api('GET','/auth/users/verify-email',{ auth:false, query:{ token } }); verify.state='ok'; verify.msg = typeof t==='string' ? t : 'Email verified'; }
                catch(e){ verify.state='error'; verify.msg=e.message; }
            }
            function submitVerifyToken(){ const t = extractToken(verify.token); if(!t){ verify.msg='Paste the link or token from your email.'; verify.state='error'; return; } go('/verify-email?token='+encodeURIComponent(t)); }

            const forgotF = useForm({ email:'' }, { email:[R.req('Email'),R.email()] });
            const forgotSent = ref(false);
            async function doForgot(){
                forgotF.banner=''; if(!forgotF.validateAll()) return;
                forgotF.busy=true;
                try{ await api('POST','/auth/users/forgot-password',{ auth:false, body:{ email:forgotF.values.email.trim() } }); forgotSent.value=true; }
                catch(e){ forgotF.banner=e.message; } finally{ forgotF.busy=false; }
            }
            const resetF = useForm({ token:'', password:'', confirmedPassword:'' }, {
                token:[R.req('Reset token')], password:[R.req('New password'),R.min(8,'Password')],
                confirmedPassword:[R.req('Confirm password'),R.same('password','Passwords do not match')] });
            async function doReset(){
                resetF.banner=''; if(!resetF.validateAll()) return;
                resetF.busy=true;
                try{
                    const r = await api('POST','/auth/users/reset-link',{ auth:false, query:{ token:extractToken(resetF.values.token) }, body:{ password:resetF.values.password, confirmedPassword:resetF.values.confirmedPassword } });
                    toast((r&&r.message)||'Password reset. You can sign in now.'); resetF.reset(); go('/login');
                }catch(e){ if(!mapServerErr(resetF,e.message,[[/token/i,'token'],[/do not match/i,'confirmedPassword']])) resetF.banner=e.message; }
                finally{ resetF.busy=false; }
            }

            /* ---------------- profile ---------------- */
            const profileF = useForm({ username:'', firstName:'', lastName:'', phone:'' }, { username:[R.req('Username')], firstName:[R.req('First name')], lastName:[R.req('Last name')], phone:[R.req('Phone number')] });
            const pwF = useForm({ currentPassword:'', newPassword:'', confirmedPassword:'' }, {
                currentPassword:[R.req('Current password')], newPassword:[R.req('New password'),R.min(8,'Password')],
                confirmedPassword:[R.req('Confirm password'),R.same('newPassword','Passwords do not match')] });
            const avatarUp = reactive({ file:null, preview:'', error:'', busy:false });
            async function loadProfilePage(){
                const u = await loadProfile();
                profileF.reset({ username:u.username||'', firstName:u.firstName||'', lastName:u.lastName||'', phone:u.phone||'' });
                pwF.reset(); avatarUp.file=null; avatarUp.preview=''; avatarUp.error='';
            }
            async function saveProfile(){
                profileF.banner=''; if(!profileF.validateAll()) return; profileF.busy=true;
                try{ const v=profileF.values; const r = await api('PUT','/auth/users/profile',{ body:{ username:v.username.trim(), firstName:v.firstName.trim(), lastName:v.lastName.trim(), phone:v.phone.trim() } }); await loadProfile(); toast((r&&r.message)||'Profile updated'); }
                catch(e){ profileF.banner=e.message; } finally{ profileF.busy=false; }
            }
            async function saveAvatar(){
                if(!avatarUp.file){ avatarUp.error='Choose a photo first.'; return; }
                avatarUp.busy=true; avatarUp.error='';
                try{ const fd=new FormData(); fd.append('image', avatarUp.file); const r = await api('PUT','/auth/users/profile/image',{ form:fd }); await loadProfile(); avatarUp.file=null; avatarUp.preview=''; toast((r&&r.message)||'Photo updated'); }
                catch(e){ avatarUp.error=e.message; } finally{ avatarUp.busy=false; }
            }
            async function changePw(){
                pwF.banner=''; if(!pwF.validateAll()) return; pwF.busy=true;
                try{ const r = await api('POST','/auth/users/change-password',{ body:{ ...pwF.values } }); pwF.reset(); toast((r&&r.message)||'Password changed'); }
                catch(e){ if(!mapServerErr(pwF,e.message,[[/current/i,'currentPassword'],[/do not match/i,'confirmedPassword']])) pwF.banner=e.message; }
                finally{ pwF.busy=false; }
            }

            /* ---------------- home / explore ---------------- */
            const home = reactive({ hotels:[] });
            let homeP = null, homeAt = 0;
            function loadHome(){
                if(homeP && Date.now()-homeAt < 60000) return homeP;
                homeAt = Date.now();
                homeP = api('GET','/api/hotels',{ auth:false, query:{ size:60, sort:'name,asc' } })
                    .then(list => { home.hotels = Array.isArray(list) ? list : []; home.hotels.forEach(h => { hc[h.id]=h; }); return list; })
                    .catch(e => { homeP=null; throw e; });
                return homeP;
            }
            const cities = computed(() => [...new Set(home.hotels.map(h=>h.city).filter(Boolean))].sort());
            const destinations = computed(() => {
                const m = {};
                home.hotels.forEach(h => { const k=h.city; if(!k) return; (m[k] = m[k] || { city:k, country:h.country, count:0, img:'' }).count++; if(!m[k].img && h.images && h.images[0]) m[k].img = h.images[0].imageUrl; });
                return Object.values(m).sort((a,b)=>b.count-a.count).slice(0,6);
            });
            const featured = computed(() => home.hotels.slice(0,6));
            const defaultQS = (city) => qsOf({ city:city||'', checkIn:toISO(addDays(new Date(),1)), checkOut:toISO(addDays(new Date(),3)), adults:2, children:0 });

            const ex = reactive({ items:[], page:0, size:9, hasNext:false, loading:false, error:'', q:{ search:'', city:'', country:'' }, sort:'name,asc' });
            async function loadExplore(p=0){
                ex.loading=true; ex.error='';
                try{
                    const list = await api('GET','/api/hotels',{ auth:false, query:{ search:ex.q.search.trim(), city:ex.q.city.trim(), country:ex.q.country.trim(), page:p, size:ex.size, sort:ex.sort } });
                    ex.items = Array.isArray(list)?list:[]; ex.page=p; ex.hasNext = ex.items.length===ex.size;
                    ex.items.forEach(h => { hc[h.id]=h; });
                }catch(e){ ex.error=e.message; ex.items=[]; } finally{ ex.loading=false; }
            }
            function clearExplore(){ ex.q.search=''; ex.q.city=''; ex.q.country=''; loadExplore(0); }

            /* ---------------- search ---------------- */
            const minIn = computed(() => toISO(addDays(new Date(),1)));
            const searchF = useForm({ city:'', checkIn:toISO(addDays(new Date(),1)), checkOut:toISO(addDays(new Date(),3)), adults:2, children:0 }, {
                city:[R.max(100,'City')],
                checkIn:[R.req('Check-in date'), v => v && v<=todayISO() ? 'Check-in must be a future date (tomorrow or later)' : ''],
                checkOut:[R.req('Check-out date'), (v,d) => v && v<=todayISO() ? 'Check-out must be a future date' : (v && d.checkIn && v<=d.checkIn ? 'Check-out must be after check-in' : '')],
                adults:[ v => !(Number(v)>=1) ? 'At least 1 adult is required' : '' ],
                children:[ v => Number(v)<0 ? 'Children cannot be negative' : '' ]
            });
            function qsOf(v){ const p = new URLSearchParams(); if(v.city && v.city.trim()) p.set('city', v.city.trim()); p.set('in',v.checkIn); p.set('out',v.checkOut); p.set('a',v.adults); p.set('c',v.children); return p.toString(); }
            function submitSearch(){ if(!searchF.validateAll()) return; go('/search?'+qsOf(searchF.values)); }
            const hc = reactive({});
            const imgOf = id => (hc[id] && hc[id].images && hc[id].images[0]) ? hc[id].images[0].imageUrl : '';
            async function enrichHotels(ids){
                const todo = [...new Set(ids)].filter(id => !hc[id]).slice(0,40);
                await Promise.all(todo.map(async id => { try{ hc[id] = await api('GET',`/api/hotels/${id}`,{ auth:false }); }catch{ hc[id] = { _failed:true }; } }));
            }
            const sr = reactive({ items:null, loading:false, error:'', q:null, priceMax:null, priceCap:0, types:[], fit:false, sort:'price' });
            const byPrice = (a,b) => Number(a.pricePerNight)-Number(b.pricePerNight);
            async function loadSearch(q){
                searchF.reset({ city:q.city||'', ...(q.in?{checkIn:q.in}:{}), ...(q.out?{checkOut:q.out}:{}), adults:Number(q.a)||2, children:Math.max(0,Number(q.c)||0) });
                sr.items=null; sr.error='';
                if(!searchF.validateAll()) return;
                const v = searchF.values; sr.loading=true;
                try{
                    const data = await api('POST','/api/availability/search',{ auth:false, body:{ checkIn:v.checkIn, checkOut:v.checkOut, adults:Number(v.adults), children:Number(v.children), city:(v.city||'').trim()||null } });
                    const items = (Array.isArray(data)?data:[]).map(h => { const rooms=(h.rooms||[]).slice().sort(byPrice); return { ...h, rooms }; });
                    sr.q = { city:(v.city||'').trim(), checkIn:v.checkIn, checkOut:v.checkOut, adults:Number(v.adults), children:Number(v.children) };
                    sr.items = items;
                    const prices = items.flatMap(h=>h.rooms.map(r=>Number(r.pricePerNight)));
                    sr.priceCap = prices.length ? Math.ceil(Math.max(...prices)) : 0; sr.priceMax = sr.priceCap; sr.types=[]; sr.fit=false; sr.sort='price';
                    enrichHotels(items.map(i=>i.hotelId));
                }catch(e){ sr.error=e.message; } finally{ sr.loading=false; }
            }
            const roomFits = (r,a,c) => r.maxAdults>=a && r.maxChildren>=c && r.maxOccupancy>=a+c;
            const typeOptions = computed(() => { const s=new Set(); (sr.items||[]).forEach(h=>h.rooms.forEach(r=>s.add(r.roomTypeName))); return [...s].filter(Boolean).sort(); });
            const results = computed(() => {
                const a = sr.q?sr.q.adults:1, c = sr.q?sr.q.children:0;
                let list = (sr.items||[]).map(h => {
                    const shown = h.rooms.filter(r => (!sr.types.length || sr.types.includes(r.roomTypeName)) && (sr.priceMax==null || Number(r.pricePerNight)<=sr.priceMax));
                    return { ...h, shown, fitCount: shown.filter(r=>roomFits(r,a,c)).length, from: shown.length ? Number(shown[0].pricePerNight) : 0 };
                }).filter(h => h.shown.length);
                if(sr.fit) list = list.filter(h=>h.fitCount>0);
                const cmp = { price:(x,y)=>x.from-y.from, 'price-desc':(x,y)=>y.from-x.from, name:(x,y)=>x.hotelName.localeCompare(y.hotelName), rooms:(x,y)=>y.shown.length-x.shown.length }[sr.sort];
                return list.sort(cmp);
            });
            const srNights = computed(() => sr.q ? nightsBetween(sr.q.checkIn, sr.q.checkOut) : 0);
            const hotelHref = id => '#/hotel/'+id + (sr.q ? '?'+new URLSearchParams({ in:sr.q.checkIn, out:sr.q.checkOut, a:sr.q.adults, c:sr.q.children }).toString() : '');
            function resetFilters(){ sr.priceMax=sr.priceCap; sr.types=[]; sr.fit=false; }
            function toggleType(t){ const i=sr.types.indexOf(t); if(i>=0) sr.types.splice(i,1); else sr.types.push(t); }

            /* ---------------- hotel page ---------------- */
            const hp = reactive({ hotel:null, policy:null, policyMissing:false, images:[], rooms:null, roomsLoading:false, roomsError:'', sel:[], q:null, lightbox:-1 });
            async function loadHotel(id, q){
                Object.assign(hp,{ hotel:null, policy:null, policyMissing:false, images:[], rooms:null, roomsError:'', sel:[], q:null, lightbox:-1 });
                const [h, pol, imgs] = await Promise.all([
                    api('GET',`/api/hotels/${id}`,{ auth:false }),
                    api('GET',`/api/hotels/${id}/child-policy`,{ auth:false }).catch(e => e.status===404 ? 'missing' : null),
                    api('GET',`/api/hotels/${id}/images`,{ auth:false }).catch(() => null)
                ]);
                hp.hotel = h; hc[h.id] = h;
                hp.policy = (pol && pol!=='missing') ? pol : null; hp.policyMissing = pol==='missing';
                hp.images = Array.isArray(imgs) && imgs.length ? imgs : (h.images||[]);
                searchF.reset({ city:h.city||'', ...(q.in?{checkIn:q.in}:{}), ...(q.out?{checkOut:q.out}:{}), adults:Number(q.a)||2, children:Math.max(0,Number(q.c)||0) });
                if(q.in && q.out && searchF.validateAll()) await loadHotelRooms(searchF.values);
            }
            async function loadHotelRooms(v){
                hp.roomsLoading=true; hp.roomsError=''; hp.sel=[]; hp.q={ checkIn:v.checkIn, checkOut:v.checkOut, adults:Number(v.adults), children:Number(v.children) };
                try{
                    const data = await api('POST','/api/availability/search',{ auth:false, body:{ checkIn:v.checkIn, checkOut:v.checkOut, adults:Number(v.adults), children:Number(v.children), city:hp.hotel.city } });

            const hpNights = computed(() => hp.q ? nightsBetween(hp.q.checkIn, hp.q.checkOut) : 0);
            const hpSelected = computed(() => (hp.rooms||[]).filter(r => hp.sel.includes(r.id)));
            const hpTotal = computed(() => hpSelected.value.reduce((s,r)=>s+Number(r.pricePerNight),0) * hpNights.value);
            function toggleRoom(id){ const i=hp.sel.indexOf(id); if(i>=0) hp.sel.splice(i,1); else hp.sel.push(id); }
            function reserve(){
                if(!hp.sel.length){ toast('Select at least one room first.','warn'); return; }
                const url = `/book/${hp.hotel.id}?`+new URLSearchParams({ in:hp.q.checkIn, out:hp.q.checkOut, a:hp.q.adults, c:hp.q.children, rooms:hp.sel.join(',') }).toString();
                if(!auth.user){ afterLogin = '#'+url; toast('Sign in or create an account to complete your booking.','info'); go('/login'); return; }

            }
            const mapSrc = computed(() => { const h=hp.hotel; if(!h || h.latitude==null || h.longitude==null) return ''; const la=Number(h.latitude), lo=Number(h.longitude); if(Number.isNaN(la)||Number.isNaN(lo)) return ''; return `https://www.openstreetmap.org/export/embed.html?bbox=${lo-0.012}%2C${la-0.007}%2C${lo+0.012}%2C${la+0.007}&layer=mapnik&marker=${la}%2C${lo}`; });
            const mapsLink = computed(() => { const h=hp.hotel; if(!h) return '#'; const q = (h.latitude!=null && h.longitude!=null) ? `${h.latitude},${h.longitude}` : `${h.name} ${h.address} ${h.city}`; return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); });
            const policyText = pol => pol ? { infant:`Infants: 0–${pol.infantMaxAge} years`, child:`Children: ${pol.infantMaxAge+1}–${pol.childMaxAge} years`, adult:`Adults: ${pol.childMaxAge+1} years and over` } : null;
            const hotelPhotos = computed(() => hp.images.map(i => i.imageUrl));

            /* ---------------- booking ---------------- */
            const bk = reactive({ hotel:null, policy:null, noPolicy:false, rooms:[], q:null, missing:[], text:'', busy:false, banner:'', done:null, errs:{}, touched:false });
            async function loadBook(id, q){
                Object.assign(bk,{ hotel:null, policy:null, noPolicy:false, rooms:[], q:null, missing:[], text:'', busy:false, banner:'', done:null, errs:{}, touched:false });
                const ids = String(q.rooms||'').split(',').map(Number).filter(Boolean);
                if(!q.in || !q.out || !ids.length){ toast('Pick your dates and rooms first.','info'); go(`/hotel/${id}`); return; }
                const v = { city:'', checkIn:q.in, checkOut:q.out, adults:Number(q.a)||1, children:Math.max(0,Number(q.c)||0) };
                searchF.reset(v);
                if(!searchF.validateAll()){ toast('Those dates are no longer valid – please choose new ones.','warn'); go(`/hotel/${id}`); return; }
                const [hotel, pol] = await Promise.all([ api('GET',`/api/hotels/${id}`,{ auth:false }), api('GET',`/api/hotels/${id}/child-policy`,{ auth:false }).catch(e => e.status===404 ? 'missing' : Promise.reject(e)) ]);
                const data = await api('POST','/api/availability/search',{ auth:false, body:{ checkIn:v.checkIn, checkOut:v.checkOut, adults:v.adults, children:v.children, city:hotel.city } });
                const mine = (Array.isArray(data)?data:[]).find(x => Number(x.hotelId)===Number(id));
                const avail = mine ? mine.rooms : [];
                const found = ids.map(i => avail.find(r=>r.id===i)).filter(Boolean);
                bk.hotel = hotel; bk.policy = pol==='missing' ? null : pol; bk.noPolicy = pol==='missing';
                bk.q = { checkIn:v.checkIn, checkOut:v.checkOut, adults:v.adults, children:v.children };
                bk.missing = ids.filter(i => !found.find(r=>r.id===i));
                let remaining = Math.max(1, v.adults+v.children);
                bk.rooms = found.map((r,idx) => {
                    const n = idx===found.length-1 ? Math.max(1,remaining) : Math.max(1, Math.min(remaining, r.maxOccupancy));
                    remaining -= n;
                    const guests = Array.from({length:n}, () => ({ name:'', age:'' }));
                    if(idx===0 && auth.user) guests[0].name = ((auth.user.firstName||'')+' '+(auth.user.lastName||'')).trim();
                    return { ...r, guests };
                });
            }
            const bkNights = computed(() => bk.q ? nightsBetween(bk.q.checkIn, bk.q.checkOut) : 0);
            const bkTotal = computed(() => bk.rooms.reduce((s,r)=>s+Number(r.pricePerNight),0) * bkNights.value);
            function roomStats(room){
                const pol = bk.policy; let adults=0, children=0, infants=0;
                room.guests.forEach(g => { if(blank(g.age) || Number.isNaN(Number(g.age))) return; const t = classify(Number(g.age), pol); if(t==='INFANT') infants++; else if(t==='CHILD') children++; else adults++; });
                const total = adults + children + (pol && pol.infantsCountTowardOccupancy ? infants : 0);
                const problems = [];
                if(adults > room.maxAdults) problems.push(`This room fits at most ${plural(room.maxAdults,'adult')} (you have ${adults}).`);
                if(children > room.maxChildren) problems.push(`This room fits at most ${plural(room.maxChildren,'child','children')} (you have ${children}).`);
                if(total > room.maxOccupancy) problems.push(`This room sleeps at most ${room.maxOccupancy} guests (you have ${total}).`);
                return { adults, children, infants, total, problems, pct: Math.min(100, Math.round(total/Math.max(1,room.maxOccupancy)*100)) };
            }
            const guestKind = (g) => (blank(g.age)||Number.isNaN(Number(g.age))) ? '' : ({ ADULT:'Adult', CHILD:'Child', INFANT:'Infant' })[classify(Number(g.age), bk.policy)];
            function addGuest(r){ r.guests.push({ name:'', age:'' }); }
            function removeGuest(r,i){ r.guests.splice(i,1); }
            function validateBooking(){
                const errs = {};
                bk.rooms.forEach((r,ri) => {
                    if(!r.guests.length) errs['r'+ri] = 'Add at least one guest to this room.';
                    r.guests.forEach((g,gi) => {
                        if(blank(g.name)) errs[`n${ri}_${gi}`] = 'Guest name is required';
                        if(blank(g.age)) errs[`a${ri}_${gi}`] = 'Age is required';
                        else if(!Number.isInteger(Number(g.age)) || Number(g.age)<0) errs[`a${ri}_${gi}`] = 'Age must be 0 or more';
                        else if(Number(g.age)>120) errs[`a${ri}_${gi}`] = 'Enter a realistic age';
                    });
                    const st = roomStats(r); if(st.problems.length) errs['c'+ri] = st.problems[0];
                });
                if(bk.text.length>500) errs.text = 'Special request cannot exceed 500 characters';
                bk.errs = errs; return !Object.keys(errs).length;

            watch(() => [bk.rooms, bk.text], () => { if(bk.touched) validateBooking(); }, { deep:true });
            function bookingHelp(e){
                const m = e.message||'';
                if(/overlap/i.test(m)) return 'Sorry – one of these rooms was just booked for your dates. Please go back and choose another room or different dates.';
                if(/accommodate|number of guests/i.test(m)) return m+' Please adjust the guests in each room.';
                if(/only active customer/i.test(m)) return 'Your account needs to be active (email verified) before you can book.';
                if(e.status>=500) return 'The hotel can’t take this booking right now. It may not be fully set up for online booking yet (for example, it has no child policy). Please try another hotel.';
                return m;
            }
            async function submitBooking(){
                bk.touched=true; bk.banner='';

                bk.busy=true;
                try{
                    await api('POST','/api/bookings',{ body:{ hotelId:bk.hotel.id, checkIn:bk.q.checkIn, checkOut:bk.q.checkOut, specialRequest:bk.text.trim()||null,
                            rooms: bk.rooms.map(r => ({ roomId:r.id, guests:r.guests.map(g=>({ name:g.name.trim(), age:Number(g.age) })) })) } });
                    let latest=null;
                    try{ const list = await api('GET','/api/bookings/my-bookings',{ query:{ page:0, size:1, sort:'id,desc' } }); latest = Array.isArray(list) && list[0] || null; }catch{}
                    bk.done = latest || { bookingReference:'', hotelName:bk.hotel.name, checkIn:bk.q.checkIn, checkOut:bk.q.checkOut, totalAmount:bkTotal.value, status:'CONFIRMED', rooms:[], adults:0, children:0 };

                try{
                    if(ad.tab==='overview'){
                        const [p,h,t,u] = await Promise.all([ api('GET','/api/hotels/pending',{ query:{ size:50 } }), api('GET','/api/hotels',{ auth:false, query:{ size:50 } }), api('GET','/api/rooms-types'), api('GET','/api/admin/users',{ query:{ size:1 } }).catch(() => null) ]);
                        ad.counts.users = u && u.totalElements!=null ? String(u.totalElements) : null;
                        ad.counts.pending = cnt(p.length,50); ad.counts.hotels = cnt(h.length,50); ad.counts.types = cnt(t.length,1000); roomTypes.value = t;
                    }
                    if(ad.tab==='pending') await loadPending(0);
                    if(ad.tab==='hotels') await loadAdminHotels(0);
                    if(ad.tab==='users') await loadAdminUsers(0);
                    if(ad.tab==='types') await loadRoomTypes();
                }catch(e){ ad.error=e.message; }
            }
            /** Loads one page of users using the server-side filters (search, status, role) and sorting. */
            async function loadAdminUsers(p=0){
                ad.loading=true; ad.error='';
                try{
                    const r = await api('GET','/api/admin/users',{ query:{ page:p, size:10, sort:ad.uq.sort, search:ad.uq.search.trim(), status:ad.uq.status, role:ad.uq.role } });
                    ad.users = r.content || []; ad.uPage = r.page; ad.uPages = r.totalPages; ad.uTotal = r.totalElements;
                }catch(e){ ad.users=[]; ad.error = e.status===404 ? 'User management needs the updated backend (GET /api/admin/users).' : e.message; }
                finally{ ad.loading=false; }
            }
            function resetUserFilters(){ Object.assign(ad.uq,{ search:'', status:'', role:'', sort:'createdAt,desc' }); loadAdminUsers(0); }
            const isSelf = u => !!auth.user && auth.user.email===u.email;
            /** Deactivate (soft delete) or reactivate a user after the admin confirms. */
            async function setUserStatus(u, status){
                const off = status==='INACTIVE';
                const yes = await ask({ title:`${off?'Deactivate':'Reactivate'} “${u.username}”?`, danger:off, confirmText: off?'Deactivate':'Reactivate',
                    message: off ? 'They won’t be able to sign in and any session they have open stops working. Their data is kept, and you can reactivate them later.' : 'They will be able to sign in again.' });
                if(!yes) return;
                ad.uBusy = u.id;
                try{ const r = await api('PATCH',`/api/admin/users/${u.id}/status`,{ body:{ status } }); toast((r&&r.message)||'Done.'); await loadAdminUsers(ad.uPage); }
                catch(e){ toast(e.message,'error'); }
                finally{ ad.uBusy=null; }
            }
            function adminTab(t){ go('/admin?tab='+t); }
            async function loadPending(p=0){ ad.loading=true; try{ const l = await api('GET','/api/hotels/pending',{ query:{ page:p, size:8, sort:'id,asc' } }); ad.pending = Array.isArray(l)?l:[]; ad.pPage=p; ad.pNext=ad.pending.length===8; }catch(e){ ad.error=e.message; } finally{ ad.loading=false; } }
            async function loadAdminHotels(p=0){
                ad.loading=true;
                try{ const l = await api('GET','/api/hotels',{ auth:false, query:{ search:ad.q.search.trim(), city:ad.q.city.trim(), country:ad.q.country.trim(), page:p, size:8, sort:'name,asc' } }); ad.hotels = Array.isArray(l)?l:[]; ad.hPage=p; ad.hNext=ad.hotels.length===8; }
                catch(e){ ad.error=e.message; } finally{ ad.loading=false; }
            }
            async function setHotelStatus(h, status, after){
                const label = { ACTIVE:'approve / activate', REJECTED:'reject', INACTIVE:'deactivate' }[status];
                const ok = await ask({ title:`${label[0].toUpperCase()+label.slice(1)} “${h.name||('hotel #'+h.id)}”?`, danger: status!=='ACTIVE', confirmText: label[0].toUpperCase()+label.slice(1),
                    message: status==='ACTIVE' ? 'The hotel will go live and guests will be able to find and book it.' : status==='REJECTED' ? 'The manager will see that the hotel was not approved.' : 'The hotel will be hidden from search and can no longer be booked.' });
                if(!ok) return false;
                try{ const r = await api('PATCH',`/api/hotels/${h.id}/status`,{ body:{ status } }); toast({ACTIVE:'Hotel approved and live.',REJECTED:'Hotel rejected.',INACTIVE:'Hotel deactivated.'}[status]||(r&&r.message)||'Hotel status updated.','success'); if(after) await after(); return true; }
                catch(e){ toast(e.message,'error'); return false; }
            }
            const statusF = useForm({ hotelId:'', status:'ACTIVE' }, { hotelId:[R.num('Hotel ID',{min:1,int:true})], status:[R.req('Status')] });
            async function runStatusTool(){
                statusF.banner=''; if(!statusF.validateAll()) return; statusF.busy=true;
                try{ const r = await api('PATCH',`/api/hotels/${Number(statusF.values.hotelId)}/status`,{ body:{ status:statusF.values.status } }); toast((r&&r.message)||'Hotel status updated.'); }
                catch(e){ statusF.banner=e.message; } finally{ statusF.busy=false; }
            }
            const assignF = useForm({ hotelId:null, hotelName:'', managerId:'' }, { managerId:[R.num('Manager user ID',{min:1,int:true})] });
            const assignModal = reactive({ open:false });
            function openAssign(h){ assignF.reset({ hotelId:h.id, hotelName:h.name, managerId:'' }); assignModal.open=true; }
            async function doAssign(){
                assignF.banner=''; if(!assignF.validateAll()) return; assignF.busy=true;
                try{ const r = await api('POST',`/api/hotels/${assignF.values.hotelId}/managers/${Number(assignF.values.managerId)}`); toast((r&&r.message)||'Manager assigned.'); assignModal.open=false; }
                catch(e){ assignF.banner=e.message; } finally{ assignF.busy=false; }
            }
            const typeF = useForm({ id:null, name:'', description:'' }, { name:[R.req('Room type name'),R.len(2,100,'Room type name')], description:[R.req('Description'),R.len(10,500,'Description')] });
            const typeModal = reactive({ open:false });
            function openType(t){ typeF.reset(t ? { id:t.id, name:t.name, description:t.description } : {}); typeModal.open=true; }
            async function saveType(){
                typeF.banner=''; if(!typeF.validateAll()) return; typeF.busy=true;
                const v=typeF.values;
                try{ const r = await api(v.id?'PUT':'POST', v.id?`/api/rooms-types/${v.id}`:'/api/rooms-types', { body:{ name:v.name.trim(), description:v.description.trim() } }); toast((r&&r.message)||'Room type saved.'); typeModal.open=false; await loadRoomTypes(); }
                catch(e){ if(e.status===409){ typeF.errors.name='A room type with this name already exists'; } else typeF.banner=e.message; } finally{ typeF.busy=false; }
            }
            async function setTypeStatus(t, status){
                if(status==='INACTIVE' && !await ask({ title:`Deactivate “${t.name}”?`, message:'Managers will no longer be able to use this room type for new rooms.', confirmText:'Deactivate', danger:true })) return;
                try{ const r = await api('PATCH',`/api/rooms-types/${t.id}/status`,{ body:{ status } }); toast((r&&r.message)||'Room type updated.'); await loadRoomTypes(); }catch(e){ toast(e.message,'error'); }
            }
            const typeActivate = reactive({ id:'', err:'' });
            async function activateTypeById(){
                typeActivate.err=''; const n=Number(typeActivate.id);
                if(blank(typeActivate.id)||!Number.isInteger(n)||n<1){ typeActivate.err='Enter a valid room type ID.'; return; }
                try{ const r = await api('PATCH',`/api/rooms-types/${n}/status`,{ body:{ status:'ACTIVE' } }); toast((r&&r.message)||'Room type activated.'); typeActivate.id=''; await loadRoomTypes(); }catch(e){ typeActivate.err=e.message; }
            }

            /* ---------------- live notifications (STOMP over WebSocket) ---------------- */
            const feed = ref([]), unread = ref(0), wsState = reactive({ on:false });
            let stomp = null;
            function loadScript(src){ return new Promise((res,rej) => { if(window.StompJs) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
            function disconnectWs(){ try{ if(stomp) stomp.deactivate(); }catch{} stomp=null; wsState.on=false; }
            function connectWs(){
                if(stomp || !auth.user) return;
                let base; try{ base = new URL(API_BASE || location.origin); }catch{ return; }
                if(!/^https?:$/.test(base.protocol)) return;
                loadScript('https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js').then(() => {
                    if(!auth.user || stomp) return;
                    stomp = new window.StompJs.Client({ brokerURL:(base.protocol==='https:'?'wss:':'ws:')+'//'+base.host+'/ws', reconnectDelay:10000,
                        onConnect(){ wsState.on=true; stomp.subscribe('/topic/bookings', m => { try{ onBookingEvent(JSON.parse(m.body)); }catch{} }); },
                        onWebSocketClose(){ wsState.on=false; } });
                    stomp.activate();
                }).catch(() => {});
            }
            function onBookingEvent(n){
                const mine = known.has(n.bookingReference), staff = isManager.value || isAdmin.value;
                if(!mine && !staff) return;
                feed.value.unshift({ ...n, at:new Date() }); if(feed.value.length>30) feed.value.pop(); unread.value++;
                if(!quietRefs.has(n.bookingReference)) toast(`Booking ${n.bookingReference}: ${n.message}`, n.status==='CANCELLED'?'warn':'info');
                if(route.name==='bookings' && mine) loadBookings(mb.page);
            }
            function toggleFeed(){ feedOpen.value=!feedOpen.value; menuOpen.value=false; if(feedOpen.value) unread.value=0; }

            function scrollToRooms(){ const el=document.getElementById('rooms'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

            /* ---------------- boot ---------------- */
            document.addEventListener('click', () => { menuOpen.value=false; feedOpen.value=false; });
            window.addEventListener('hashchange', applyRoute);
            (async () => {
                if(auth.token){
                    const exp = jwtExp(auth.token);
                    if(exp && exp*1000 < Date.now()) clearSession();
                    else { try{ await loadProfile(); connectWs(); }catch(e){ clearSession(); } }
                }
                readyResolve(); applyRoute();
                loadHome().catch(()=>{});
            })();

            const navActive = n => ({ home:['home','search'], explore:['explore'], bookings:['bookings'], manage:['manage','manage-new','manage-hotel'], admin:['admin'] })[n].includes(route.name);

            return {
                route, page, auth, role, isCustomer, isManager, isAdmin, pending, toasts, dismiss, dlg, answer, menuOpen, feedOpen, toggleFeed, feed, unread, wsState,
                go, href, logout, scrollToRooms, navActive, profileImage, userInitials,
                loginF, doLogin, regF, regImage, pwStrength, pickImage, doRegister, verify, submitVerifyToken, forgotF, forgotSent, doForgot, resetF, doReset,
                profileF, pwF, avatarUp, saveProfile, saveAvatar, changePw,
                home, cities, destinations, featured, defaultQS, ex, loadExplore, clearExplore,
                minIn, searchF, submitSearch, sr, results, typeOptions, srNights, hotelHref, resetFilters, toggleType, imgOf, hc, roomFits,
                hp, checkHotelDates, hpNights, hpSelected, hpTotal, toggleRoom, reserve, mapSrc, mapsLink, policyText, hotelPhotos,
                bk, bkNights, bkTotal, roomStats, guestKind, addGuest, removeGuest, submitBooking,
                mb, mbShown, loadBookings, bd, openBooking, cancelBooking,
                lk, lookupBooking, completeBooking, cancelFromLookup,
                hotelF, hotelEditId, saveHotel, useMyLocation,
                mh, loadManagerHotels, mp, manageTab, roomTypes, loadMRooms, roomF, roomModal, openRoomModal, saveRoom,
                imgUp, pickHotelImages, dropImage, uploadHotelImages, deleteHotelImage, policyF, savePolicy,
                ad, adminTab, loadAdminUsers, resetUserFilters, setUserStatus, isSelf, ROLE_LABEL, loadPending, loadAdminHotels, setHotelStatus, statusF, runStatusTool, assignF, assignModal, openAssign, doAssign,
                typeF, typeModal, openType, saveType, setTypeStatus, typeActivate, activateTypeById, loadRoomTypes,
                toISO, addDays, tomorrowISO: () => toISO(addDays(new Date(),1)),
            };
        }

        app.mount('#app');
    })();
</script>
</body>
</html>
