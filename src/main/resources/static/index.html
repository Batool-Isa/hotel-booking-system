<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VibeStay – Find your next stay</title>
    <meta name="description" content="VibeStay – search hotels, check live availability and book your stay.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23003b95'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='%23febb02' font-family='Arial'%3EV%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --navy:#003b95;--navy-d:#00224f;--blue:#006ce4;--blue-h:#0057b8;--blue-s:#ebf3ff;
            --yellow:#febb02;--yellow-h:#e8a900;--green:#008234;--green-s:#e6f4ea;--red:#c5192d;--red-s:#fdecee;
            --amber:#8a5a00;--amber-s:#fff4d6;--ink:#1a1a1a;--muted:#5f6368;--line:#e1e4e8;--bg:#f4f6f9;--card:#fff;
            --r:10px;--sh:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--sh2:0 8px 24px rgba(16,24,40,.14);
        }
        *{box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
        a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
        h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;color:var(--ink)}
        h1{font-size:2.1rem;font-weight:800}h2{font-size:1.5rem;font-weight:800}h3{font-size:1.15rem;font-weight:700}h4{font-size:1rem;font-weight:700}
        p{margin:0 0 .8em}
        img{max-width:100%;display:block}
        [v-cloak]{display:none}
        button,input,select,textarea{font:inherit;color:inherit}
        :focus-visible{outline:3px solid rgba(0,108,228,.45);outline-offset:2px;border-radius:6px}
        .wrap{max-width:1160px;margin:0 auto;padding:0 16px}
        .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .between{justify-content:space-between}
        .spacer{flex:1}
        .stack>*+*{margin-top:14px}
        .muted{color:var(--muted)}.small{font-size:.85rem}.xs{font-size:.78rem}.bold{font-weight:700}.center{text-align:center}.right{text-align:right}
        .mt{margin-top:16px}.mt2{margin-top:28px}.mb{margin-bottom:16px}.hide{display:none!important}
        .grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
        .ic{flex:none;vertical-align:middle}
        .loadbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--yellow);z-index:200;transition:width .3s,opacity .3s;opacity:0}
        .loadbar.on{width:85%;opacity:1;transition:width 8s cubic-bezier(.1,.7,.2,1)}

        /* header */
        .topbar{background:var(--navy);color:#fff;position:relative;z-index:60}
        .topbar-in{display:flex;align-items:center;gap:12px;height:62px}
        .brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
        .brand:hover{text-decoration:none}
        .logo-mark{width:32px;height:32px;border-radius:8px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:1.1rem;font-weight:900}
        .navtabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
        .navtabs::-webkit-scrollbar{display:none}
        .nav-pill{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;color:#fff;font-weight:600;font-size:.92rem;white-space:nowrap;border:1px solid transparent}
        .nav-pill:hover{background:rgba(255,255,255,.12);text-decoration:none}
        .nav-pill.on{background:rgba(255,255,255,.14);border-color:#fff}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid transparent;background:#fff;color:var(--blue);font-weight:700;font-size:.95rem;cursor:pointer;transition:background .15s,box-shadow .15s,transform .05s;text-decoration:none!important;white-space:nowrap}
        .btn:active{transform:translateY(1px)}
        .btn[disabled],.btn.is-loading{opacity:.6;cursor:not-allowed;pointer-events:none}
        .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-h)}
        .btn-yellow{background:var(--yellow);color:#1a1a1a}.btn-yellow:hover{background:var(--yellow-h)}
        .btn-outline{background:#fff;border-color:var(--blue);color:var(--blue)}.btn-outline:hover{background:var(--blue-s)}
        .btn-ghost{background:transparent;color:var(--blue)}.btn-ghost:hover{background:var(--blue-s)}
        .btn-light{background:#fff;color:var(--navy)}.btn-light:hover{background:#eaf1ff}
        .btn-outline-light{background:transparent;border-color:#fff;color:#fff}.btn-outline-light:hover{background:rgba(255,255,255,.12)}
        .btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#a3111f}
        .btn-danger-o{background:#fff;border-color:var(--red);color:var(--red)}.btn-danger-o:hover{background:var(--red-s)}
        .btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#006a2b}
        .btn-sm{padding:6px 12px;font-size:.85rem}.btn-lg{padding:14px 26px;font-size:1.05rem}.btn-block{width:100%}
        .btn.is-loading::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .icon-btn{position:relative;background:transparent;border:0;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
        .icon-btn:hover{background:rgba(255,255,255,.14)}
        .dot{position:absolute;top:2px;right:0;background:var(--red);color:#fff;border-radius:999px;font-size:.68rem;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
        .user-btn{display:flex;align-items:center;gap:9px;background:transparent;border:0;color:#fff;cursor:pointer;padding:5px 8px;border-radius:999px;text-align:left}
        .user-btn:hover{background:rgba(255,255,255,.14)}
        .user-btn small{display:block;color:#b8d0ff;font-size:.72rem;line-height:1}
        .avatar{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none;font-size:.95rem}
        .avatar img{width:100%;height:100%;object-fit:cover}
        .avatar.lg{width:96px;height:96px;font-size:2rem}
        .menu{position:absolute;right:0;top:54px;background:#fff;color:var(--ink);border-radius:var(--r);box-shadow:var(--sh2);min-width:220px;padding:6px;z-index:70;border:1px solid var(--line)}
        .menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;color:var(--ink);background:none;border:0;cursor:pointer;font-weight:500;text-align:left}
        .menu a:hover,.menu button:hover{background:var(--bg);text-decoration:none}
        .menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
        .rel{position:relative}
        .feed{position:absolute;right:0;top:50px;width:340px;max-width:92vw;background:#fff;color:var(--ink);border-radius:var(--r);box-shadow:var(--sh2);z-index:70;border:1px solid var(--line);overflow:hidden}
        .feed header{padding:12px 14px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
        .feed li{list-style:none;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.88rem}
        .feed ul{margin:0;padding:0;max-height:320px;overflow:auto}

        /* hero & search */
        .hero{background:linear-gradient(135deg,var(--navy-d),var(--navy) 60%,#1a5fc4);color:#fff;padding:44px 0 86px;position:relative;overflow:hidden}
        .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.05)}
        .hero::before{width:420px;height:420px;right:-90px;top:-170px}.hero::after{width:260px;height:260px;right:200px;bottom:-150px}
        .hero h1,.hero p{color:#fff;position:relative}.hero p{font-size:1.1rem;opacity:.9;max-width:620px}
        .searchwrap{margin-top:-40px;position:relative;z-index:5}
        .searchbar{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr auto;gap:0;background:var(--yellow);padding:4px;border-radius:12px;box-shadow:var(--sh2);position:relative}
        .searchbar.nocity{grid-template-columns:1fr 1fr 1.2fr auto}
        .sb-field{background:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;margin:0;border-radius:8px;border:2px solid transparent;position:relative;min-width:0}
        .searchbar>*{margin:0 2px}
        .sb-field .ic{color:var(--muted)}
        .sb-field label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
        .sb-field input{border:0;outline:0;width:100%;padding:2px 0;background:transparent;font-weight:600;font-size:.98rem;min-width:0}
        .sb-field.bad{border-color:var(--red)}
        .sb-field>div{min-width:0;flex:1}
        .guest-btn{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;text-align:left;width:100%;padding:0}
        .guest-btn span{font-weight:600;font-size:.98rem;display:block;white-space:nowrap}
        .guest-pop{position:absolute;top:calc(100% + 8px);right:0;width:300px;background:#fff;border-radius:var(--r);box-shadow:var(--sh2);padding:16px;z-index:30;border:1px solid var(--line)}
        .stepper{display:flex;align-items:center;gap:12px}
        .stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;display:grid;place-items:center}
        .stepper button[disabled]{opacity:.35;cursor:not-allowed}
        .stepper b{min-width:22px;text-align:center}
        .sb-btn{border-radius:8px;padding:0 28px;font-size:1.1rem}
        .sb-errors{grid-column:1/-1;background:var(--red-s);color:var(--red);padding:8px 14px;border-radius:8px;margin:4px 2px 0;font-size:.88rem;display:flex;gap:8px;align-items:center}
        .searchbar.compact{box-shadow:var(--sh)}

        /* cards & forms */
        .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
        .pad{padding:20px}.pad-s{padding:14px 16px}
        .card-h{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;justify-content:space-between}
        .card-h h3{margin:0}
        .field{margin-bottom:14px}
        .field label{display:block;font-weight:600;font-size:.88rem;margin-bottom:5px}
        .req{color:var(--red);margin-left:3px}
        .input-wrap{position:relative}
        .input,.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #b5bcc5;border-radius:8px;background:#fff;font-size:.96rem;transition:border-color .15s,box-shadow .15s}
        .field input[type=checkbox]{width:auto}
        .field textarea{resize:vertical;min-height:84px}
        .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,108,228,.18);outline:0}
        .field.has-error input,.field.has-error select,.field.has-error textarea{border-color:var(--red);background:#fffafa}
        .field input:disabled{background:#f1f3f5;color:var(--muted)}
        .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;width:34px;height:34px;display:grid;place-items:center}
        .field-foot{display:flex;justify-content:space-between;gap:8px;min-height:0;margin-top:4px}
        .err{color:var(--red);font-size:.82rem;display:flex;gap:5px;align-items:center;font-weight:500}
        .hint{color:var(--muted);font-size:.8rem}.counter{color:var(--muted);font-size:.78rem;margin-left:auto}
        .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}.form-grid .full{grid-column:1/-1}
        .strength{height:5px;background:#e9ecef;border-radius:5px;overflow:hidden;margin-top:6px}.strength i{display:block;height:100%;transition:width .2s,background .2s}
        .check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:.92rem}
        .check input{width:18px;height:18px;accent-color:var(--blue)}
        .alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;font-size:.92rem;margin-bottom:14px;border:1px solid}
        .alert .ic{margin-top:2px}
        .alert.error{background:var(--red-s);color:#7d1020;border-color:#f3bcc4}
        .alert.warn{background:var(--amber-s);color:var(--amber);border-color:#f1d78a}
        .alert.info{background:var(--blue-s);color:#003b95;border-color:#bcd7fb}
        .alert.ok{background:var(--green-s);color:#0b5b27;border-color:#b6dcc2}
        .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}
        .b-green{background:var(--green-s);color:var(--green)}.b-red{background:var(--red-s);color:var(--red)}.b-yellow{background:var(--amber-s);color:var(--amber)}.b-blue{background:var(--blue-s);color:var(--navy)}.b-gray{background:#eceff3;color:#4a5159}
        .score{background:var(--navy);color:#fff;border-radius:8px 8px 8px 0;padding:6px 9px;font-weight:800;font-size:.95rem}
        .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:.8rem;margin:0 6px 6px 0}
        .chip.on{background:var(--blue-s);border-color:var(--blue);color:var(--navy)}

        /* sections */
        .section{padding-top:34px;padding-bottom:34px}
        .page{padding:26px 0 60px;min-height:62vh}
        .crumbs{font-size:.85rem;color:var(--muted);margin-bottom:12px}
        .dest{position:relative;border-radius:var(--r);overflow:hidden;height:170px;display:flex;align-items:flex-end;color:#fff;cursor:pointer;box-shadow:var(--sh)}
        .dest:hover{text-decoration:none;transform:translateY(-2px);box-shadow:var(--sh2)}
        .dest{transition:transform .15s,box-shadow .15s}
        .dest::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.65))}
        .dest .meta{position:relative;z-index:2;padding:14px}.dest .meta h3{color:#fff;margin:0}.dest .meta span{font-size:.85rem;opacity:.9}
        .dest .ph{position:absolute;inset:0}
        .usp{display:flex;gap:14px;align-items:flex-start}.usp .ico{width:46px;height:46px;border-radius:12px;background:var(--blue-s);color:var(--blue);display:grid;place-items:center;flex:none}
        .ph{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.85);font-weight:800;font-size:2.4rem;letter-spacing:-.03em;position:relative;overflow:hidden}
        .ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.25),transparent 45%)}
        .hcard{display:grid;grid-template-columns:260px 1fr 210px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin-bottom:16px;transition:box-shadow .15s}
        .hcard:hover{box-shadow:var(--sh2)}
        .hc-img{display:block;min-height:200px;background:#dfe6ef}.hc-img img{width:100%;height:100%;object-fit:cover;min-height:200px}
        .hc-body{padding:16px 18px;min-width:0}.hc-body h3 a{color:var(--blue)}
        .hc-price{padding:16px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;text-align:right;gap:8px}
        .hc-price strong{font-size:1.45rem;display:block;line-height:1.1}
        .loc{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.88rem;margin-bottom:8px}
        .gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
        .gcard:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
        .gcard .img{height:170px;background:#dfe6ef}.gcard .img img{width:100%;height:100%;object-fit:cover}
        .gcard .bd{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
        .layout{display:grid;grid-template-columns:270px 1fr;gap:22px;align-items:start}
        .layout-b{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start}
        .sticky{position:sticky;top:16px}
        .filter h4{font-size:.95rem;margin:16px 0 8px}.filter h4:first-child{margin-top:0}
        .filter input[type=range]{width:100%;accent-color:var(--blue)}

        /* hotel page */
        .gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:170px 170px;gap:8px;border-radius:var(--r);overflow:hidden}
        .gallery>div{background:#dfe6ef;overflow:hidden;cursor:pointer;position:relative}
        .gallery>div:first-child{grid-row:1/3}
        .gallery img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
        .gallery>div:hover img{transform:scale(1.04)}
        .gallery.none{grid-template-columns:1fr;grid-template-rows:190px}
        .gallery.one{grid-template-columns:1fr;grid-template-rows:340px}
        .gallery.two{grid-template-columns:1fr 1fr;grid-template-rows:340px}.gallery.two>div:first-child{grid-row:auto}
        .more-pics{position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-weight:700}
        .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:120;display:grid;place-items:center;padding:20px}
        .lightbox img{max-height:86vh;max-width:94vw;border-radius:8px}
        .lightbox button{position:absolute;top:16px;right:16px}
        table.t{width:100%;border-collapse:collapse}
        table.t th{background:var(--navy);color:#fff;text-align:left;padding:10px 14px;font-size:.82rem;font-weight:700}
        table.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
        table.t tr.sel td{background:var(--blue-s)}
        table.t.plain th{background:#f1f4f8;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-size:.74rem}
        .scroll-x{overflow-x:auto}
        .mapframe{width:100%;height:240px;border:0;border-radius:8px;background:#dfe6ef}
        .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
        .fact{display:flex;gap:10px;align-items:center;font-size:.92rem}
        .steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
        .step{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:.9rem}
        .step i{width:26px;height:26px;border-radius:50%;background:#dde2e8;color:#fff;display:grid;place-items:center;font-style:normal;font-size:.82rem}
        .step.on{color:var(--ink)}.step.on i{background:var(--blue)}.step.done i{background:var(--green)}
        .step+.step::before{content:"";width:34px;height:2px;background:#cfd5dc;margin-right:8px}
        .guest-row{display:grid;grid-template-columns:1fr 110px 110px auto;gap:10px;align-items:start}
        .cap{height:7px;background:#e6eaef;border-radius:6px;overflow:hidden}.cap i{display:block;height:100%;background:var(--green);transition:width .2s}
        .cap.over i{background:var(--red)}
        .tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
        .tab{padding:10px 16px;border:0;background:none;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;display:flex;gap:8px;align-items:center}
        .tab:hover{color:var(--ink)}.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
        .empty{text-align:center;padding:48px 20px;color:var(--muted)}
        .empty .big{width:72px;height:72px;border-radius:50%;background:var(--blue-s);color:var(--blue);display:grid;place-items:center;margin:0 auto 14px}
        .skel{background:linear-gradient(90deg,#e8ecf1 25%,#f4f6f9 37%,#e8ecf1 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:8px}
        @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
        .authbox{max-width:480px;margin:34px auto}
        .authbox.wide{max-width:640px}
        .pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:20px 0}
        .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:.93rem}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
        .ref{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--amber-s);padding:2px 8px;border-radius:6px;font-weight:700;letter-spacing:.05em}
        .big-ref{font-size:2rem;letter-spacing:.12em;padding:8px 20px}
        .dz{border:2px dashed #b5bcc5;border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:background .15s,border-color .15s}
        .dz:hover{background:var(--blue-s);border-color:var(--blue)}
        .thumb{width:84px;height:64px;border-radius:8px;object-fit:cover;background:#dfe6ef}
        .pimg{position:relative;border-radius:8px;overflow:hidden;background:#dfe6ef;height:130px}.pimg img{width:100%;height:100%;object-fit:cover}
        .pimg .del{position:absolute;top:6px;right:6px}
        .stat{padding:16px 18px}.stat b{font-size:1.9rem;display:block;line-height:1.1}.stat span{color:var(--muted);font-size:.85rem}
        footer.site{background:var(--navy-d);color:#c9d6ee;padding:34px 0;margin-top:30px;font-size:.88rem}
        footer.site a{color:#fff}

        /* toasts & modal */
        .toasts{position:fixed;top:70px;right:16px;z-index:150;display:flex;flex-direction:column;gap:10px;width:360px;max-width:calc(100vw - 32px)}
        .toast{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:10px;box-shadow:var(--sh2);padding:12px 14px;border-left:5px solid var(--blue);animation:slide .25s ease-out;font-size:.92rem}
        .toast.success{border-color:var(--green)}.toast.error{border-color:var(--red)}.toast.info{border-color:var(--blue)}.toast.warn{border-color:var(--yellow)}
        .toast .ic{margin-top:2px}.toast.success .ic{color:var(--green)}.toast.error .ic{color:var(--red)}.toast.info .ic{color:var(--blue)}.toast.warn .ic{color:var(--amber)}
        .toast button{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted)}
        @keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
        .modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:110;display:grid;place-items:center;padding:16px;overflow:auto}
        .modal{background:#fff;border-radius:14px;box-shadow:var(--sh2);width:100%;max-width:520px;max-height:92vh;overflow:auto;animation:pop .18s ease-out}
        .modal.lg{max-width:760px}
        .modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}
        .modal-h h3{margin:0}.modal-b{padding:20px}.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fafbfc}
        @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
        .x-btn{background:none;border:0;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.x-btn:hover{background:var(--bg)}

        @media(max-width:980px){
            .layout,.layout-b{grid-template-columns:1fr}.sticky{position:static}
            .searchbar,.searchbar.nocity{grid-template-columns:1fr 1fr}.sb-btn{grid-column:1/-1;padding:14px}
            .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
        }
        @media(max-width:760px){
            h1{font-size:1.6rem}
            .hcard{grid-template-columns:1fr}.hc-price{border-left:0;border-top:1px solid var(--line);align-items:stretch;text-align:left}
            .hc-img,.hc-img img{min-height:170px;height:170px}
            .g2,.g3,.g4,.form-grid,.facts{grid-template-columns:1fr}
            .gallery{grid-template-columns:1fr 1fr;grid-template-rows:180px 110px}.gallery>div:first-child{grid-column:1/-1;grid-row:1}
            .searchbar,.searchbar.nocity{grid-template-columns:1fr}.searchbar>*{margin:2px}
            .guest-row{grid-template-columns:1fr 1fr}.guest-row .full-m{grid-column:1/-1}
            .user-btn span,.user-btn small{display:none}
            .kv{grid-template-columns:1fr}
            .guest-pop{width:100%}
            .brand{font-size:1.2rem}
        }
        @media print{
            .no-print,.topbar,footer.site,.toasts{display:none!important}
            body{background:#fff}.card{box-shadow:none}
        }
    </style>
</head>
<body>
<div id="app" v-cloak></div>
<script type="text/x-template" id="app-tpl">
    <div>
        <div class="loadbar no-print" :class="{on:pending>0}"></div>
        <datalist id="city-list"><option v-for="c in cities" :key="c" :value="c"></option></datalist>

        <!-- ================= HEADER ================= -->
        <header class="topbar no-print">
            <div class="wrap topbar-in">
                <a class="brand" href="#/"><span class="logo-mark">V</span>VibeStay</a>
                <div class="spacer"></div>
                <template v-if="auth.user">
                    <div class="rel" @click.stop>
                        <button class="icon-btn" @click="toggleFeed" aria-label="Notifications" title="Live booking notifications"><icon name="bell" :size="20"></icon><span v-if="unread" class="dot">{{unread}}</span></button>
                        <div v-if="feedOpen" class="feed">
                            <header><span>Live notifications</span><span class="xs muted">{{wsState.on?'● connected':'○ offline'}}</span></header>
                            <ul><li v-if="!feed.length" class="muted">Nothing yet. Booking updates appear here in real time.</li>
                                <li v-for="(n,i) in feed" :key="i"><b>{{n.bookingReference}}</b> <span class="badge" :class="statusClass(n.status)">{{statusLabel(n.status)}}</span><div class="small">{{n.message}}</div></li></ul>
                        </div>
                    </div>
                    <div class="rel" @click.stop>
                        <button class="user-btn" @click="menuOpen=!menuOpen;feedOpen=false" :aria-expanded="menuOpen">
                            <span class="avatar"><img v-if="profileImage" :src="profileImage" alt="" @error="$event.target.remove()"><template v-else>{{userInitials}}</template></span>
                            <span><b>{{auth.user.firstName||auth.user.username}}</b><small>{{roleLabel(role)}}</small></span><icon name="down" :size="16"></icon>
                        </button>
                        <div v-if="menuOpen" class="menu" role="menu">
                            <a href="#/profile"><icon name="user"></icon>My profile</a>
                            <a v-if="isCustomer" href="#/bookings"><icon name="list"></icon>My bookings</a>
                            <a v-if="isManager" href="#/manage"><icon name="brief"></icon>Manager portal</a>
                            <a v-if="isAdmin" href="#/admin"><icon name="shield"></icon>Admin panel</a>
                            <hr><button @click="logout"><icon name="logout"></icon>Sign out</button>
                        </div>
                    </div>
                </template>
                <template v-else>
                    <a class="btn btn-outline-light btn-sm" href="#/register">Register</a>
                    <a class="btn btn-light btn-sm" href="#/login">Sign in</a>
                </template>
            </div>
            <nav class="wrap navtabs" aria-label="Main">
                <a class="nav-pill" :class="{on:navActive('home')}" href="#/"><icon name="bed"></icon>Stays</a>
                <a class="nav-pill" :class="{on:navActive('explore')}" href="#/explore"><icon name="building"></icon>Explore hotels</a>
                <a v-if="isCustomer" class="nav-pill" :class="{on:navActive('bookings')}" href="#/bookings"><icon name="calendar"></icon>My bookings</a>
                <a v-if="isManager" class="nav-pill" :class="{on:navActive('manage')}" href="#/manage"><icon name="brief"></icon>Manager portal</a>
                <a v-if="isAdmin" class="nav-pill" :class="{on:navActive('admin')}" href="#/admin"><icon name="shield"></icon>Admin panel</a>
            </nav>
        </header>

        <main>
            <!-- ================= HOME ================= -->
            <section v-if="route.name==='home'">
                <div class="hero"><div class="wrap">
                    <h1>Find your next stay</h1>
                    <p>Search hotels, see real-time room availability and book in minutes – with instant confirmation by email.</p>
                </div></div>
                <div class="wrap searchwrap"><search-bar :f="searchF" :min-in="minIn" @submit="submitSearch"></search-bar></div>

                <div class="wrap section" v-if="page.error"><alert-box type="error" :msg="page.error"></alert-box></div>

                <div class="wrap section" v-if="destinations.length">
                    <h2>Popular destinations</h2><p class="muted">Cities with hotels you can book right now</p>
                    <div class="grid g3">
                        <a v-for="d in destinations" :key="d.city" class="dest" :href="'#/search?city='+encodeURIComponent(d.city)+'&'+defaultQS('')">
                            <hotel-img :src="d.img" :name="d.city"></hotel-img>
                            <div class="meta"><h3>{{d.city}}</h3><span>{{d.country}} · {{plural(d.count,'hotel')}}</span></div>
                        </a>
                    </div>
                </div>

                <div class="wrap section" v-if="featured.length">
                    <div class="row between"><div><h2>Featured stays</h2><p class="muted">Hand-picked places guests love</p></div><a class="btn btn-outline" href="#/explore">See all hotels<icon name="right" :size="16"></icon></a></div>
                    <div class="grid g3">
                        <a v-for="h in featured" :key="h.id" class="gcard" :href="'#/hotel/'+h.id" style="color:inherit;text-decoration:none">
                            <div class="img"><hotel-img :src="h.images && h.images[0] && h.images[0].imageUrl" :name="h.name"></hotel-img></div>
                            <div class="bd"><h3 style="margin:0;color:var(--blue)">{{h.name}}</h3><div class="loc"><icon name="pin" :size="15"></icon>{{h.city}}, {{h.country}}</div>
                                <div class="muted small" style="flex:1">{{(h.description||'').slice(0,90)}}{{(h.description||'').length>90?'…':''}}</div></div>
                        </a>
                    </div>
                </div>

                <div class="wrap section" v-if="!page.loading && !page.error && !home.hotels.length">
                    <div class="card empty"><div class="big"><icon name="building" :size="32"></icon></div><h3>No hotels are live yet</h3><p>Once an admin approves a hotel it will appear here. You can still try a search above.</p></div>
                </div>

                <div class="wrap section">
                    <div class="grid g3">
                        <div class="usp"><div class="ico"><icon name="check" :size="22"></icon></div><div><h4>Real-time availability</h4><p class="muted small">We only show rooms that are free for your exact dates – no surprises.</p></div></div>
                        <div class="usp"><div class="ico"><icon name="mail" :size="22"></icon></div><div><h4>Instant confirmation</h4><p class="muted small">Your booking is confirmed straight away and sent to your inbox.</p></div></div>
                        <div class="usp"><div class="ico"><icon name="x" :size="22"></icon></div><div><h4>Easy cancellations</h4><p class="muted small">Change of plans? Cancel from “My bookings” in two clicks.</p></div></div>
                    </div>
                </div>
            </section>

            <!-- ================= SEARCH RESULTS ================= -->
            <section v-if="route.name==='search'" class="page">
                <div class="wrap">
                    <search-bar :f="searchF" :min-in="minIn" compact :busy="sr.loading" @submit="submitSearch"></search-bar>
                    <div class="layout mt2">
                        <aside class="card pad filter sticky no-print" v-if="sr.items && sr.items.length">
                            <div class="row between"><h3 style="margin:0">Filter by</h3><button class="btn btn-ghost btn-sm" @click="resetFilters">Reset</button></div>
                            <h4>Max price per night: <span class="blue">{{money(sr.priceMax)}}</span></h4>
                            <input type="range" min="0" :max="sr.priceCap" step="1" v-model.number="sr.priceMax" aria-label="Maximum price per night">
                            <h4>Room type</h4>
                            <label v-for="t in typeOptions" :key="t" class="check" style="margin-bottom:8px"><input type="checkbox" :checked="sr.types.includes(t)" @change="toggleType(t)">{{t}}</label>
                            <h4>Your group</h4>
                            <label class="check" style="align-items:flex-start"><input type="checkbox" v-model="sr.fit" style="margin-top:3px"><span>Only hotels with a room that fits {{sr.q?plural(sr.q.adults,'adult'):'1 adult'}}<template v-if="sr.q && sr.q.children">, {{plural(sr.q.children,'child','children')}}</template></span></label>
                        </aside>
                        <div :style="(sr.items && sr.items.length) ? '' : 'grid-column:1/-1'">
                            <alert-box v-if="sr.error" type="error" :msg="sr.error"></alert-box>
                            <div v-if="sr.loading"><div v-for="i in 3" :key="i" class="skel" style="height:200px;margin-bottom:16px"></div></div>
                            <template v-else-if="sr.items">
                                <div class="row between mb">
                                    <div><h2 style="margin:0">{{sr.q.city || 'All destinations'}}: {{plural(results.length,'hotel')}} available</h2>
                                        <div class="muted small">{{fmtDate(sr.q.checkIn)}} → {{fmtDate(sr.q.checkOut)}} · {{plural(srNights,'night')}} · {{plural(sr.q.adults,'adult')}}, {{plural(sr.q.children,'child','children')}}</div></div>
                                    <label class="small row no-print" style="gap:6px">Sort by
                                        <select v-model="sr.sort" style="padding:8px 10px;border:1px solid #b5bcc5;border-radius:8px"><option value="price">Price (lowest first)</option><option value="price-desc">Price (highest first)</option><option value="name">Name (A–Z)</option><option value="rooms">Most rooms available</option></select></label>
                                </div>
                                <article v-for="h in results" :key="h.hotelId" class="hcard">
                                    <a class="hc-img" :href="hotelHref(h.hotelId)"><hotel-img :src="imgOf(h.hotelId)" :name="h.hotelName"></hotel-img></a>
                                    <div class="hc-body">
                                        <h3><a :href="hotelHref(h.hotelId)">{{h.hotelName}}</a></h3>
                                        <div class="loc"><icon name="pin" :size="15"></icon>{{h.address}}, {{h.city}}, {{h.country}}</div>
                                        <div v-if="hc[h.hotelId] && hc[h.hotelId].amenities && hc[h.hotelId].amenities.length" style="margin-bottom:8px"><span v-for="a in hc[h.hotelId].amenities.slice(0,5)" :key="a.id" class="chip">{{amenityIcon(a.name)}} {{a.name}}</span></div>
                                        <div v-for="r in h.shown.slice(0,2)" :key="r.id" class="small" style="margin-bottom:3px"><b>{{r.roomTypeName}}</b> · sleeps {{r.maxOccupancy}} · {{money(r.pricePerNight)}}/night
                                            <span v-if="roomFits(r,sr.q.adults,sr.q.children)" class="badge b-green"><icon name="check" :size="12"></icon>fits your group</span></div>
                                        <div class="small" style="color:var(--green);font-weight:600;margin-top:6px">{{plural(h.shown.length,'room')}} available for your dates<span v-if="!h.fitCount" class="muted" style="font-weight:400"> – you may need more than one room</span></div>
                                    </div>
                                    <div class="hc-price">
                                        <span v-if="hc[h.hotelId] && hc[h.hotelId].averageRating" class="score">{{Number(hc[h.hotelId].averageRating).toFixed(1)}}</span><span v-else></span>
                                        <div><div class="muted xs">{{plural(srNights,'night')}}, from</div><strong>{{money(h.from*srNights)}}</strong><div class="muted xs">{{money(h.from)}} per night</div></div>
                                        <a class="btn btn-primary" :href="hotelHref(h.hotelId)">See availability<icon name="right" :size="16"></icon></a>
                                    </div>
                                </article>
                                <div v-if="!results.length" class="card empty">
                                    <div class="big"><icon name="search" :size="30"></icon></div>
                                    <h3>{{sr.items.length ? 'No hotels match your filters' : 'No hotels available for these dates'}}</h3>
                                    <p v-if="sr.items.length">Try raising the maximum price or clearing the room type filter.</p>
                                    <p v-else>Try different dates{{sr.q.city?', or search another city':''}}.</p>
                                    <button v-if="sr.items.length" class="btn btn-outline" @click="resetFilters">Clear filters</button>
                                    <a v-else-if="sr.q.city" class="btn btn-outline" :href="'#/search?'+defaultQS('')">Search all destinations</a>
                                </div>
                            </template>
                            <div v-else-if="!sr.error" class="card empty"><div class="big"><icon name="calendar" :size="30"></icon></div><h3>Check your search</h3><p>Please fix the highlighted dates above and search again.</p></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ================= EXPLORE ================= -->
            <section v-if="route.name==='explore'" class="page">
                <div class="wrap">
                    <h2>Explore hotels</h2><p class="muted">Browse every hotel on VibeStay. Pick dates on a hotel page to see its available rooms.</p>
                    <form class="card pad mb" @submit.prevent="loadExplore(0)">
                        <div class="grid g4" style="align-items:end">
                            <f-input v-model="ex.q.search" label="Hotel name" placeholder="e.g. Grand"></f-input>
                            <f-input v-model="ex.q.city" label="City" placeholder="e.g. Manama" list="city-list"></f-input>
                            <f-input v-model="ex.q.country" label="Country" placeholder="e.g. Bahrain"></f-input>
                            <div class="field row" style="gap:8px"><button class="btn btn-primary" :class="{'is-loading':ex.loading}"><icon name="search"></icon>Filter</button><button type="button" class="btn btn-ghost" @click="clearExplore">Clear</button></div>
                        </div>
                        <label class="small row" style="gap:8px">Sort by <select v-model="ex.sort" @change="loadExplore(0)" style="padding:7px 10px;border:1px solid #b5bcc5;border-radius:8px"><option value="name,asc">Name (A–Z)</option><option value="name,desc">Name (Z–A)</option><option value="city,asc">City (A–Z)</option></select></label>
                    </form>
                    <alert-box v-if="ex.error" type="error" :msg="ex.error"></alert-box>
                    <div v-if="ex.loading" class="grid g3"><div v-for="i in 6" :key="i" class="skel" style="height:290px"></div></div>
                    <div v-else-if="ex.items.length" class="grid g3">
                        <a v-for="h in ex.items" :key="h.id" class="gcard" :href="'#/hotel/'+h.id" style="color:inherit;text-decoration:none">
                            <div class="img"><hotel-img :src="h.images && h.images[0] && h.images[0].imageUrl" :name="h.name"></hotel-img></div>
                            <div class="bd"><h3 style="margin:0;color:var(--blue)">{{h.name}}</h3><div class="loc"><icon name="pin" :size="15"></icon>{{h.address}}, {{h.city}}</div>
                                <div class="muted small" style="flex:1">{{(h.description||'').slice(0,110)}}{{(h.description||'').length>110?'…':''}}</div>
                                <div><span v-for="a in (h.amenities||[]).slice(0,4)" :key="a.id" class="chip">{{amenityIcon(a.name)}} {{a.name}}</span></div></div>
                        </a>
                    </div>
                    <div v-else-if="!ex.error" class="card empty"><div class="big"><icon name="building" :size="30"></icon></div><h3>No hotels found</h3><p>Try a different search or clear your filters.</p><button class="btn btn-outline" @click="clearExplore">Clear filters</button></div>
                    <div class="pager" v-if="ex.page>0 || ex.hasNext"><button class="btn btn-outline btn-sm" :disabled="ex.page===0" @click="loadExplore(ex.page-1)"><icon name="left" :size="16"></icon>Previous</button><span class="muted small">Page {{ex.page+1}}</span><button class="btn btn-outline btn-sm" :disabled="!ex.hasNext" @click="loadExplore(ex.page+1)">Next<icon name="right" :size="16"></icon></button></div>
                </div>
            </section>

            <!-- ================= HOTEL DETAILS ================= -->
            <section v-if="route.name==='hotel'" class="page">
                <div class="wrap">
                    <div v-if="page.loading"><div class="skel" style="height:340px;margin-bottom:16px"></div><div class="skel" style="height:140px"></div></div>
                    <div v-else-if="page.error" class="card empty"><div class="big"><icon name="alert" :size="30"></icon></div><h3>We couldn’t load this hotel</h3><p>{{page.error}}</p><a class="btn btn-primary" href="#/">Back to search</a></div>
                    <template v-else-if="hp.hotel">
                        <div class="crumbs"><a href="#/">Stays</a> › <a href="#/explore">Hotels</a> › {{hp.hotel.name}}</div>
                        <div class="row between" style="align-items:flex-start;margin-bottom:14px">
                            <div style="min-width:0"><h1 style="margin-bottom:6px">{{hp.hotel.name}}</h1>
                                <div class="loc" style="font-size:.95rem"><icon name="pin" :size="16"></icon>{{hp.hotel.address}}, {{hp.hotel.city}}, {{hp.hotel.country}} · <a :href="mapsLink" target="_blank" rel="noopener">Show on map<icon name="ext" :size="13"></icon></a></div></div>
                            <div class="row no-print"><div class="row" v-if="hp.hotel.averageRating" style="gap:8px"><span class="score">{{Number(hp.hotel.averageRating).toFixed(1)}}</span><span class="small muted" v-if="hp.hotel.reviewCount">{{plural(hp.hotel.reviewCount,'review')}}</span></div><button class="btn btn-primary" @click="scrollToRooms">See availability</button></div>
                        </div>

                        <div class="gallery" :class="{none:!hotelPhotos.length,one:hotelPhotos.length===1,two:hotelPhotos.length===2}">
                            <template v-if="hotelPhotos.length">
                                <div v-for="(u,i) in hotelPhotos.slice(0,hotelPhotos.length<2?1:3)" :key="i" @click="hp.lightbox=i"><hotel-img :src="u" :name="hp.hotel.name" :alt="(hp.images[i]&&hp.images[i].altText)||hp.hotel.name"></hotel-img>
                                    <div v-if="i===2 && hotelPhotos.length>3" class="more-pics">+{{hotelPhotos.length-3}} photos</div></div>
                            </template>
                            <div v-else style="grid-column:1/-1;grid-row:1/-1;cursor:default"><hotel-img :src="''" :name="hp.hotel.name"></hotel-img></div>
                        </div>
                        <div v-if="hp.lightbox>=0" class="lightbox" @click="hp.lightbox=-1">
                            <button class="btn btn-light btn-sm" @click.stop="hp.lightbox=-1"><icon name="x" :size="16"></icon>Close</button>
                            <img :src="imgUrl(hotelPhotos[hp.lightbox])" :alt="(hp.images[hp.lightbox]&&hp.images[hp.lightbox].altText)||hp.hotel.name" @click.stop>
                        </div>

                        <div class="layout-b mt2">
                            <div class="stack">
                                <div class="card pad"><h3>About this hotel</h3><p style="white-space:pre-line;margin:0">{{hp.hotel.description}}</p></div>

                                <div class="card pad" v-if="hp.hotel.amenities && hp.hotel.amenities.length"><h3>Facilities</h3>
                                    <div class="grid g3" style="gap:10px">
                                        <div v-for="a in hp.hotel.amenities" :key="a.id" class="fact"><span style="font-size:1.3rem">{{amenityIcon(a.name)}}</span><div><b>{{a.name}}</b><div class="xs muted" v-if="a.description">{{a.description}}</div><div class="xs" v-if="a.additionalCost>0" style="color:var(--amber)">+ {{money(a.additionalCost)}}</div><div class="xs" style="color:var(--green)" v-else>Free</div></div></div>
                                    </div></div>

                                <div class="card pad" id="rooms">
                                    <h3>Availability</h3>
                                    <p class="muted small">Choose your dates to see which rooms are free. Select one or more rooms, then reserve.</p>
                                    <search-bar :f="searchF" hide-city compact :min-in="minIn" :busy="hp.roomsLoading" @submit="checkHotelDates"></search-bar>
                                    <alert-box v-if="hp.roomsError" type="error" :msg="hp.roomsError"></alert-box>
                                    <div v-if="hp.roomsLoading" class="skel mt" style="height:120px"></div>
                                    <div v-else-if="hp.rooms===null && !hp.roomsError" class="empty"><div class="big"><icon name="calendar" :size="30"></icon></div><p style="margin:0">Pick your check-in and check-out dates above and press <b>Search</b>.</p></div>
                                    <div v-else-if="hp.rooms && !hp.rooms.length" class="empty"><div class="big"><icon name="bed" :size="30"></icon></div><h3>No rooms available for these dates</h3><p>Try different dates – this hotel is fully booked for {{fmtDate(hp.q.checkIn)}} → {{fmtDate(hp.q.checkOut)}}.</p></div>
                                    <div v-else-if="hp.rooms" class="scroll-x mt"><table class="t">

                                            <td class="small"><div><icon name="user" :size="14"></icon> up to {{plural(r.maxAdults,'adult')}}</div><div><icon name="baby" :size="14"></icon> up to {{plural(r.maxChildren,'child','children')}}</div><div class="muted">max {{r.maxOccupancy}} guests</div></td>
                                            <td><b>{{money(r.pricePerNight)}}</b></td>
                                            <td><b>{{money(r.pricePerNight*hpNights)}}</b><div class="xs muted">taxes may apply</div></td>
                                            <td><button class="btn btn-sm" :class="hp.sel.includes(r.id)?'btn-green':'btn-outline'" @click="toggleRoom(r.id)"><icon :name="hp.sel.includes(r.id)?'check':'plus'" :size="15"></icon>{{hp.sel.includes(r.id)?'Selected':'Select'}}</button></td></tr></tbody>
                                    </table></div>
                                </div>
                            </div>

                            <aside class="stack sticky">
                                <div class="card pad" v-if="hp.rooms && hp.rooms.length">
                                    <h3>Your selection</h3>
                                    <div v-if="!hp.sel.length" class="muted small">No rooms selected yet. Pick one or more rooms from the list.</div>
                                    <template v-else>
                                        <div v-for="r in hpSelected" :key="r.id" class="row between small" style="margin-bottom:6px"><span>{{r.roomTypeName}} <span class="muted">· Room {{r.roomNumber}}</span></span><b>{{money(r.pricePerNight)}}</b></div>
                                        <hr style="border:0;border-top:1px solid var(--line)">
                                        <div class="small muted">{{fmtDate(hp.q.checkIn)}} → {{fmtDate(hp.q.checkOut)}} · {{plural(hpNights,'night')}}</div>
                                        <div class="row between" style="margin:8px 0 14px"><span>Total</span><strong style="font-size:1.4rem">{{money(hpTotal)}}</strong></div>
                                    </template>
                                    <button class="btn btn-primary btn-block btn-lg mt" :disabled="!hp.sel.length" @click="reserve">Reserve<icon name="right" :size="18"></icon></button>
                                    <p class="xs muted center mt" style="margin-bottom:0">You won’t be charged yet – you’ll review everything first.</p>
                                </div>
                                <div class="card pad">
                                    <h4>Hotel policy</h4>
                                    <template v-if="hp.policy"><div class="small" style="line-height:1.9"><div><icon name="baby" :size="15"></icon> {{policyText(hp.policy).infant}}</div><div><icon name="users" :size="15"></icon> {{policyText(hp.policy).child}}</div><div><icon name="user" :size="15"></icon> {{policyText(hp.policy).adult}}</div></div></template>
                                    <p v-else class="small muted" style="margin:0">This hotel hasn’t published its child policy yet.<span v-if="hp.policyMissing"> Online booking becomes available once it does.</span></p>
                                </div>
                                <div class="card pad">
                                    <h4>Location &amp; contact</h4>
                                    <iframe v-if="mapSrc" class="mapframe" :src="mapSrc" loading="lazy" title="Hotel location map"></iframe>
                                    <div class="small" style="margin-top:10px;line-height:1.9"><div><icon name="pin" :size="15"></icon> {{hp.hotel.address}}, {{hp.hotel.city}}</div><div v-if="hp.hotel.phone"><icon name="phone" :size="15"></icon> {{hp.hotel.phone}}</div><div><a :href="mapsLink" target="_blank" rel="noopener">Open in Google Maps<icon name="ext" :size="13"></icon></a></div></div>
                                </div>
                            </aside>
                        </div>
                    </template>
                </div>
            </section>

            <!-- ================= BOOKING ================= -->
            <section v-if="route.name==='book'" class="page">
                <div class="wrap">

                    <div v-else-if="page.error" class="card empty"><div class="big"><icon name="alert" :size="30"></icon></div><h3>We couldn’t start your booking</h3><p>{{page.error}}</p><a class="btn btn-primary" :href="'#/hotel/'+route.params.id">Back to the hotel</a></div>

                    <!-- confirmation -->
                    <template v-else-if="bk.done">
                        <div class="steps"><div class="step done"><i>✓</i>Your selection</div><div class="step done"><i>✓</i>Guest details</div><div class="step on"><i>3</i>Confirmed</div></div>
                        <div class="card pad center" style="max-width:720px;margin:0 auto">
                            <div style="width:72px;height:72px;border-radius:50%;background:var(--green-s);color:var(--green);display:grid;place-items:center;margin:0 auto 12px"><icon name="check" :size="40"></icon></div>
                            <h1>Your booking is confirmed!</h1>
                            <p class="muted">We’ve emailed your confirmation. Show this reference at check-in.</p>
                            <div v-if="bk.done.bookingReference" style="margin:16px 0"><span class="ref big-ref">{{bk.done.bookingReference}}</span></div>
                            <div class="card pad-s" style="text-align:left;margin:18px 0"><booking-detail v-if="bk.done.rooms && bk.done.rooms.length" :b="bk.done"></booking-detail>
                                <dl v-else class="kv"><dt>Hotel</dt><dd>{{bk.done.hotelName}}</dd><dt>Dates</dt><dd>{{fmtDate(bk.done.checkIn)}} → {{fmtDate(bk.done.checkOut)}}</dd><dt>Total</dt><dd>{{money(bk.done.totalAmount)}}</dd></dl></div>
                            <div class="row" style="justify-content:center"><a class="btn btn-primary" href="#/bookings"><icon name="list"></icon>View my bookings</a><button class="btn btn-outline" onclick="window.print()"><icon name="print"></icon>Print</button><a class="btn btn-ghost" href="#/">Book another stay</a></div>
                        </div>
                    </template>

                    <template v-else-if="bk.hotel">
                        <div class="steps no-print"><div class="step done"><i>✓</i>Your selection</div><div class="step on"><i>2</i>Guest details</div><div class="step"><i>3</i>Confirmed</div></div>
                        <h1>Complete your booking</h1>
                        <alert-box v-if="bk.banner" type="error"><div>{{bk.banner}} <a :href="'#/hotel/'+bk.hotel.id">Back to rooms</a></div></alert-box>
                        <alert-box v-if="bk.noPolicy" type="warn"><b>This hotel can’t take online bookings yet.</b> It hasn’t set up its child policy, which we need to check room capacity. Please choose another hotel or contact the hotel directly. <a :href="'#/hotel/'+bk.hotel.id">Back</a></alert-box>
                        <alert-box v-if="bk.missing.length" type="warn">{{plural(bk.missing.length,'room was','rooms were')}} just booked by someone else and {{bk.missing.length===1?'was':'were'}} removed from your selection. <a :href="'#/hotel/'+bk.hotel.id+'?in='+bk.q.checkIn+'&out='+bk.q.checkOut+'&a='+bk.q.adults+'&c='+bk.q.children">Choose another room</a></alert-box>
                        <div v-if="!bk.rooms.length && !bk.noPolicy" class="card empty"><div class="big"><icon name="bed" :size="30"></icon></div><h3>Those rooms are no longer available</h3><p>Please go back and choose different rooms or dates.</p><a class="btn btn-primary" :href="'#/hotel/'+bk.hotel.id">Choose rooms</a></div>

                        <form v-if="bk.rooms.length && !bk.noPolicy" class="layout-b" @submit.prevent="submitBooking" novalidate>
                            <div class="stack">
                                <div v-for="(r,ri) in bk.rooms" :key="r.id" class="card">
                                    <div class="card-h"><div><h3>Room {{ri+1}}: {{r.roomTypeName}}</h3><div class="xs muted">Room {{r.roomNumber}} · up to {{r.maxAdults}} adults, {{r.maxChildren}} children, {{r.maxOccupancy}} guests in total</div></div><b>{{money(r.pricePerNight)}}<span class="xs muted"> / night</span></b></div>
                                    <div class="pad">
                                        <div v-for="(g,gi) in r.guests" :key="gi" class="guest-row" style="margin-bottom:6px">
                                            <f-input v-model="g.name" :label="gi===0?'Guest name':''" placeholder="Full name" autocomplete="off" :error="bk.errs['n'+ri+'_'+gi]" class="full-m"></f-input>
                                            <f-input v-model="g.age" :label="gi===0?'Age':''" type="number" min="0" max="120" placeholder="Age" inputmode="numeric" :error="bk.errs['a'+ri+'_'+gi]"></f-input>
                                            <div class="field"><label v-if="gi===0">Guest type</label><div style="padding:10px 0"><span v-if="guestKind(g)" class="badge" :class="guestKind(g)==='Adult'?'b-blue':guestKind(g)==='Child'?'b-yellow':'b-green'">{{guestKind(g)}}</span><span v-else class="xs muted">Enter age</span></div></div>
                                            <div class="field"><label v-if="gi===0">&nbsp;</label><button type="button" class="btn btn-ghost btn-sm" style="margin-top:2px" :disabled="r.guests.length<=1" @click="removeGuest(r,gi)" aria-label="Remove guest"><icon name="trash" :size="16"></icon></button></div>
                                        </div>
                                        <button type="button" class="btn btn-outline btn-sm" @click="addGuest(r)"><icon name="plus" :size="15"></icon>Add guest</button>
                                        <div style="margin-top:14px">
                                            <div class="row between xs muted"><span>Occupancy: {{roomStats(r).total}} of {{r.maxOccupancy}} · {{roomStats(r).adults}} adult(s), {{roomStats(r).children}} child(ren)<span v-if="roomStats(r).infants">, {{roomStats(r).infants}} infant(s)</span></span></div>
                                            <div class="cap" :class="{over:roomStats(r).problems.length}" style="margin-top:5px"><i :style="{width:roomStats(r).pct+'%'}"></i></div>
                                            <div v-for="p in roomStats(r).problems" :key="p" class="err bk-err" style="margin-top:6px"><icon name="alert" :size="14"></icon>{{p}}</div>
                                            <div v-if="bk.errs['r'+ri]" class="err bk-err" style="margin-top:6px"><icon name="alert" :size="14"></icon>{{bk.errs['r'+ri]}}</div>
                                            <div v-if="roomStats(r).total>0 && !roomStats(r).adults" class="hint" style="margin-top:6px">Tip: there’s no adult in this room – children usually need to be accompanied by an adult.</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card pad">
                                    <f-input v-model="bk.text" textarea :rows="3" label="Special requests (optional)" :maxlength="500" counter placeholder="e.g. late check-in, high floor, extra pillows" :error="bk.errs.text" hint="Requests can’t be guaranteed, but the hotel will do its best."></f-input>
                                </div>
                            </div>
                            <aside class="sticky stack">
                                <div class="card pad">
                                    <h3>{{bk.hotel.name}}</h3>
                                    <div class="loc"><icon name="pin" :size="15"></icon>{{bk.hotel.city}}, {{bk.hotel.country}}</div>
                                    <dl class="kv" style="grid-template-columns:90px 1fr"><dt>Check-in</dt><dd>{{fmtDate(bk.q.checkIn)}}</dd><dt>Check-out</dt><dd>{{fmtDate(bk.q.checkOut)}}</dd><dt>Length</dt><dd>{{plural(bkNights,'night')}}</dd></dl>
                                    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
                                    <div v-for="r in bk.rooms" :key="r.id" class="row between small" style="margin-bottom:6px"><span>{{r.roomTypeName}} × {{plural(bkNights,'night')}}</span><span>{{money(r.pricePerNight*bkNights)}}</span></div>
                                    <div class="row between" style="margin-top:12px"><b>Total</b><strong style="font-size:1.6rem">{{money(bkTotal)}}</strong></div>
                                    <div class="xs muted">Pay at the hotel. Free cancellation from “My bookings” while your booking is confirmed.</div>
                                    <button class="btn btn-yellow btn-block btn-lg mt" :class="{'is-loading':bk.busy}" style="font-weight:800">Confirm booking</button>
                                    <a class="btn btn-ghost btn-block mt" :href="'#/hotel/'+bk.hotel.id+'?in='+bk.q.checkIn+'&out='+bk.q.checkOut+'&a='+bk.q.adults+'&c='+bk.q.children">← Change rooms</a>
                                </div>
                            </aside>
                        </form>
                    </template>
                </div>
            </section>

            <!-- ================= AUTH: LOGIN ================= -->
            <section v-if="route.name==='login'" class="page"><div class="wrap">
                <div class="card pad authbox">
                    <h2>Sign in</h2><p class="muted">Welcome back! Sign in to manage your bookings.</p>
                    <alert-box v-if="loginF.banner" type="error"><div>{{loginF.banner}}<div v-if="/verify your email/i.test(loginF.banner)" class="small mt">Check your inbox for the verification link, or <a href="#/verify-email">paste your token here</a>.</div></div></alert-box>
                    <form @submit.prevent="doLogin" novalidate>
                        <f-input v-model="loginF.values.email" label="Email address" type="email" autocomplete="email" placeholder="you@example.com" required :error="loginF.errors.email" @blur="loginF.check('email')"></f-input>
                        <f-input v-model="loginF.values.password" label="Password" type="password" autocomplete="current-password" required :error="loginF.errors.password" @blur="loginF.check('password')"></f-input>
                        <div class="row between" style="margin:-4px 0 14px"><span></span><a href="#/forgot" class="small">Forgot your password?</a></div>
                        <button class="btn btn-primary btn-block btn-lg" :class="{'is-loading':loginF.busy}">Sign in</button>
                    </form>
                    <p class="center small mt2" style="margin-bottom:0">New to VibeStay? <a href="#/register"><b>Create an account</b></a></p>
                </div>
            </div></section>

            <!-- ================= AUTH: REGISTER ================= -->
            <section v-if="route.name==='register'" class="page"><div class="wrap">
                <div class="card pad authbox wide">
                    <h2>Create your account</h2><p class="muted">Join VibeStay to book hotels and manage your trips. We’ll email you a link to verify your address.</p>
                    <alert-box v-if="regF.banner" type="error" :msg="regF.banner"></alert-box>
                    <form @submit.prevent="doRegister" novalidate>
                        <div class="row" style="gap:18px;margin-bottom:14px;align-items:center">
                            <span class="avatar lg" :style="regImage.error?'outline:3px solid var(--red)':''"><img v-if="regImage.preview" :src="regImage.preview" alt="Profile preview"><icon v-else name="user" :size="38"></icon></span>
                            <div><label class="btn btn-outline btn-sm" style="cursor:pointer"><icon name="upload" :size="15"></icon>{{regImage.file?'Change photo':'Choose profile photo'}}<input type="file" accept="image/jpeg,image/png,image/webp" class="hide" @change="pickImage($event,regImage)"></label>
                                <div class="hint" style="margin-top:4px">Optional · JPG, PNG or WebP, up to 1 MB. You can add or change it later in your profile.</div><div v-if="regImage.error" class="err" role="alert"><icon name="alert" :size="14"></icon>{{regImage.error}}</div></div>
                        </div>
                        <div class="form-grid">
                            <f-input v-model="regF.values.firstName" label="First name" required autocomplete="given-name" :error="regF.errors.firstName" @blur="regF.check('firstName')"></f-input>
                            <f-input v-model="regF.values.lastName" label="Last name" required autocomplete="family-name" :error="regF.errors.lastName" @blur="regF.check('lastName')"></f-input>
                            <f-input v-model="regF.values.username" label="Username" required autocomplete="username" :error="regF.errors.username" @blur="regF.check('username')"></f-input>
                            <f-input v-model="regF.values.phone" label="Phone number" type="tel" required autocomplete="tel" placeholder="+973 3xxx xxxx" :error="regF.errors.phone" @blur="regF.check('phone')"></f-input>
                            <f-input class="full" v-model="regF.values.email" label="Email address" type="email" required autocomplete="email" placeholder="you@example.com" :error="regF.errors.email" @blur="regF.check('email')"></f-input>
                            <div><f-input v-model="regF.values.password" label="Password" type="password" required autocomplete="new-password" hint="At least 8 characters" :error="regF.errors.password" @blur="regF.check('password')"></f-input>
                                <div v-if="regF.values.password" class="strength" style="margin:-8px 0 12px"><i :style="{width:pwStrength.pct+'%',background:pwStrength.color}"></i></div><div v-if="regF.values.password" class="xs" style="margin:-6px 0 10px" :style="{color:pwStrength.color}">{{pwStrength.label}}</div></div>
                            <f-input v-model="regF.values.confirmedPassword" label="Confirm password" type="password" required autocomplete="new-password" :error="regF.errors.confirmedPassword" @blur="regF.check('confirmedPassword')"></f-input>
                        </div>
                        <button class="btn btn-primary btn-block btn-lg" :class="{'is-loading':regF.busy}">Create account</button>
                    </form>
                    <p class="center small mt2" style="margin-bottom:0">Already have an account? <a href="#/login"><b>Sign in</b></a></p>
                </div>
            </div></section>

            <section v-if="route.name==='check-email'" class="page"><div class="wrap">
                <div class="card pad authbox center">
                    <div style="width:72px;height:72px;border-radius:50%;background:var(--blue-s);color:var(--blue);display:grid;place-items:center;margin:0 auto 12px"><icon name="mail" :size="36"></icon></div>
                    <h2>Check your email</h2>
                    <p class="muted">We’ve sent a verification link<span v-if="route.query.email"> to <b>{{route.query.email}}</b></span>. Click it to activate your account, then sign in. The link is valid for 24 hours.</p>
                    <a class="btn btn-primary btn-block" href="#/login">Go to sign in</a>
                    <p class="small muted mt">Didn’t get it? Check your spam folder. Already have the token? <a href="#/verify-email">Verify manually</a></p>
                </div>
            </div></section>

            <section v-if="route.name==='verify-email'" class="page"><div class="wrap">
                <div class="card pad authbox center">
                    <template v-if="verify.state==='loading'"><div class="skel" style="height:90px"></div><p class="muted mt">Verifying your email…</p></template>
                    <template v-else-if="verify.state==='ok'">
                        <div style="width:72px;height:72px;border-radius:50%;background:var(--green-s);color:var(--green);display:grid;place-items:center;margin:0 auto 12px"><icon name="check" :size="40"></icon></div>
                        <h2>Email verified</h2><p class="muted">Your account is active. You can sign in now.</p><a class="btn btn-primary btn-block" href="#/login">Sign in</a>
                    </template>
                    <template v-else>
                        <h2>Verify your email</h2>
                        <alert-box v-if="verify.state==='error'" type="error" :msg="verify.msg"></alert-box>
                        <p class="muted">Open the link from your verification email, or paste the link / token below.</p>
                        <form @submit.prevent="submitVerifyToken" style="text-align:left"><f-input v-model="verify.token" label="Verification link or token" placeholder="Paste here"></f-input><button class="btn btn-primary btn-block">Verify email</button></form>
                    </template>
                </div>
            </div></section>

            <section v-if="route.name==='forgot'" class="page"><div class="wrap">
                <div class="card pad authbox">
                    <template v-if="!forgotSent">
                        <h2>Forgot your password?</h2><p class="muted">Enter your email and we’ll send you a link to reset it.</p>
                        <alert-box v-if="forgotF.banner" type="error" :msg="forgotF.banner"></alert-box>
                        <form @submit.prevent="doForgot" novalidate>
                            <f-input v-model="forgotF.values.email" label="Email address" type="email" required autocomplete="email" :error="forgotF.errors.email" @blur="forgotF.check('email')"></f-input>
                            <button class="btn btn-primary btn-block btn-lg" :class="{'is-loading':forgotF.busy}">Send reset link</button>
                        </form>
                        <p class="center small mt2" style="margin-bottom:0"><a href="#/login">← Back to sign in</a></p>
                    </template>
                    <template v-else>
                        <div class="center"><div style="width:72px;height:72px;border-radius:50%;background:var(--green-s);color:var(--green);display:grid;place-items:center;margin:0 auto 12px"><icon name="mail" :size="36"></icon></div>
                            <h2>Check your inbox</h2><p class="muted">If an account exists for that email, a reset link is on its way. It expires in 15 minutes.</p>
                            <a class="btn btn-primary btn-block" href="#/reset-password">I have my reset token</a><p class="small mt"><a href="#/login">Back to sign in</a></p></div>
                    </template>
                </div>
            </div></section>

            <section v-if="route.name==='reset-password'" class="page"><div class="wrap">
                <div class="card pad authbox">
                    <h2>Choose a new password</h2><p class="muted">Paste the reset link or token from your email, then pick a new password.</p>
                    <alert-box v-if="resetF.banner" type="error" :msg="resetF.banner"></alert-box>
                    <form @submit.prevent="doReset" novalidate>
                        <f-input v-model="resetF.values.token" label="Reset link or token" required :error="resetF.errors.token" @blur="resetF.check('token')"></f-input>
                        <f-input v-model="resetF.values.password" label="New password" type="password" required autocomplete="new-password" hint="At least 8 characters" :error="resetF.errors.password" @blur="resetF.check('password')"></f-input>
                        <f-input v-model="resetF.values.confirmedPassword" label="Confirm new password" type="password" required autocomplete="new-password" :error="resetF.errors.confirmedPassword" @blur="resetF.check('confirmedPassword')"></f-input>
                        <button class="btn btn-primary btn-block btn-lg" :class="{'is-loading':resetF.busy}">Reset password</button>
                    </form>
                </div>
            </div></section>

            <!-- ================= PROFILE ================= -->
            <section v-if="route.name==='profile' && auth.user" class="page"><div class="wrap" style="max-width:860px">
                <div v-if="page.error" class="alert error"><icon name="alert"></icon>{{page.error}}</div>
                <div class="card pad row" style="gap:20px;margin-bottom:18px">
                    <span class="avatar lg"><img v-if="avatarUp.preview||profileImage" :src="avatarUp.preview||profileImage" alt="Your profile photo" @error="$event.target.remove()"><template v-else>{{userInitials}}</template></span>
                    <div><h2 style="margin-bottom:2px">{{auth.user.firstName}} {{auth.user.lastName}}</h2><div class="muted">@{{auth.user.username}} · {{auth.user.email}}</div><span class="badge b-blue" style="margin-top:6px">{{roleLabel(role)}}</span></div>
                </div>
                <div class="grid g2" style="align-items:start">
                    <div class="card pad">
                        <h3>Personal details</h3>
                        <alert-box v-if="profileF.banner" type="error" :msg="profileF.banner"></alert-box>
                        <form @submit.prevent="saveProfile" novalidate>
                            <f-input :model-value="auth.user.email" label="Email" disabled hint="Your email is your sign-in and can’t be changed"></f-input>
                            <f-input v-model="profileF.values.username" label="Username" required :error="profileF.errors.username" @blur="profileF.check('username')"></f-input>
                            <div class="form-grid"><f-input v-model="profileF.values.firstName" label="First name" required :error="profileF.errors.firstName" @blur="profileF.check('firstName')"></f-input><f-input v-model="profileF.values.lastName" label="Last name" required :error="profileF.errors.lastName" @blur="profileF.check('lastName')"></f-input></div>
                            <f-input v-model="profileF.values.phone" label="Phone number" type="tel" required :error="profileF.errors.phone" @blur="profileF.check('phone')"></f-input>
                            <button class="btn btn-primary" :class="{'is-loading':profileF.busy}">Save changes</button>
                        </form>
                    </div>
                    <div class="stack">
                        <div class="card pad">
                            <h3>Profile photo</h3>

                                <button class="btn btn-outline" :class="{'is-loading':pwF.busy}">Update password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div></section>

            <!-- ================= MY BOOKINGS ================= -->
            <section v-if="route.name==='bookings'" class="page"><div class="wrap" style="max-width:900px">
                <div class="row between"><div><h2>My bookings</h2><p class="muted">Your reservations, most recent first.</p></div><button class="btn btn-outline btn-sm" @click="loadBookings(mb.page)"><icon name="refresh" :size="15"></icon>Refresh</button></div>
                <div class="tabs"><button v-for="f in [['ALL','All'],['CONFIRMED','Confirmed'],['COMPLETED','Completed'],['CANCELLED','Cancelled']]" :key="f[0]" class="tab" :class="{on:mb.filter===f[0]}" @click="mb.filter=f[0]">{{f[1]}}</button></div>
                <alert-box v-if="mb.error" type="error" :msg="mb.error"></alert-box>

                    <article v-for="b in mbShown" :key="b.id" class="card pad" style="margin-bottom:14px">

                            <div style="min-width:0"><div class="row" style="gap:10px"><h3 style="margin:0">{{b.hotelName}}</h3><span class="badge" :class="statusClass(b.status)">{{statusLabel(b.status)}}</span></div>
                                <div class="small muted" style="margin-top:4px">Reference <span class="ref">{{b.bookingReference}}</span></div></div>
                            <div class="right"><div class="xs muted">Total</div><strong style="font-size:1.3rem">{{money(b.totalAmount)}}</strong></div>
                        </div>
                        <div class="row small" style="gap:22px;margin:12px 0"><span><icon name="calendar" :size="15"></icon> {{fmtDate(b.checkIn)}} → {{fmtDate(b.checkOut)}} ({{plural(nightsBetween(b.checkIn,b.checkOut),'night')}})</span><span><icon name="users" :size="15"></icon> {{plural(b.adults,'adult')}}, {{plural(b.children,'child','children')}}</span><span><icon name="bed" :size="15"></icon> {{plural((b.rooms||[]).length,'room')}}</span></div>
                        <div class="row"><button class="btn btn-outline btn-sm" @click="openBooking(b.id)"><icon name="list" :size="15"></icon>View details</button>
                            <a class="btn btn-ghost btn-sm" :href="'#/hotel/'+b.hotelId">View hotel</a>
                            <button v-if="b.status==='CONFIRMED'" class="btn btn-danger-o btn-sm" @click="cancelBooking(b,()=>loadBookings(mb.page))"><icon name="x" :size="15"></icon>Cancel booking</button></div>
                    </article>
                    <div class="pager" v-if="mb.page>0 || mb.hasNext"><button class="btn btn-outline btn-sm" :disabled="mb.page===0" @click="loadBookings(mb.page-1)"><icon name="left" :size="16"></icon>Newer</button><span class="muted small">Page {{mb.page+1}}</span><button class="btn btn-outline btn-sm" :disabled="!mb.hasNext" @click="loadBookings(mb.page+1)">Older<icon name="right" :size="16"></icon></button></div>
                </template>
            </div></section>

            <!-- ================= MANAGER PORTAL ================= -->
            <section v-if="route.name==='manage'" class="page"><div class="wrap">
                <div class="row between"><div><h2>Manager portal</h2><p class="muted">The hotels you manage. New hotels are reviewed by an admin before they go live.</p></div><a class="btn btn-primary" href="#/manage/new"><icon name="plus" :size="16"></icon>Add a hotel</a></div>
                <alert-box v-if="mh.error" type="error" :msg="mh.error"></alert-box>
                <div v-if="mh.loading" class="grid g3"><div v-for="i in 3" :key="i" class="skel" style="height:260px"></div></div>
                <div v-else-if="!mh.items.length && !mh.error" class="card empty"><div class="big"><icon name="building" :size="30"></icon></div><h3>You don’t manage any hotels yet</h3><p>Add your first hotel – an admin will review and approve it.</p><a class="btn btn-primary" href="#/manage/new">Add a hotel</a></div>
                <div v-else class="grid g3">
                    <article v-for="h in mh.items" :key="h.id" class="gcard">
                        <div class="img"><hotel-img :src="h.images && h.images[0] && h.images[0].imageUrl" :name="h.name"></hotel-img></div>
                        <div class="bd"><div class="row between"><h3 style="margin:0">{{h.name}}</h3>
                            <span v-if="mh.live[h.id]===true" class="badge b-green">Live</span><span v-else-if="mh.live[h.id]===false" class="badge b-yellow" title="Pending approval, rejected or inactive">Not live</span></div>
