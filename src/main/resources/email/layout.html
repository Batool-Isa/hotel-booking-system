<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{{DOC_TITLE}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;-webkit-text-size-adjust:100%;">
<!-- preheader (inbox preview text) -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f4f6f9;">{{PREHEADER}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f6f9;">
<tr><td align="center" style="padding:28px 12px;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">

    <!-- brand header -->
    <tr><td style="background-color:#003b95;border-radius:16px 16px 0 0;padding:26px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td width="44" height="44" align="center" valign="middle" style="width:44px;height:44px;background-color:#febb02;border-radius:12px;font-size:25px;font-weight:bold;color:#003b95;line-height:44px;">V</td>
        <td style="padding-left:12px;">
          <div style="font-size:22px;font-weight:bold;color:#ffffff;line-height:1.1;">VibeStay</div>
          <div style="font-size:12px;color:#b9cdf0;margin-top:3px;">Your stay starts here</div>
        </td>
      </tr></table>
    </td></tr>

    <!-- content card -->
    <tr><td style="background-color:#ffffff;padding:0;">
      {{CONTENT}}
    </td></tr>

    <!-- footer -->
    <tr><td style="background-color:#ffffff;border-radius:0 0 16px 16px;padding:0 32px 30px 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td style="border-top:1px solid #e1e4e8;padding-top:22px;font-size:13px;line-height:1.6;color:#5f6368;">
          {{FOOTER_NOTE}}
        </td></tr>
      </table>
    </td></tr>

    <tr><td align="center" style="padding:22px 12px 0 12px;font-size:12px;line-height:1.6;color:#8a9099;">
      <b style="color:#003b95;">VibeStay</b> &middot; Your stay starts here<br>
      &copy; 2026 VibeStay. All rights reserved.
    </td></tr>

  </table>

</td></tr>
</table>
</body>
</html>
